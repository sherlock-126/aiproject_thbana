<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: one working column, max 1180px; a quiet top bar, then tool panels. Ledger-green accent, warm green-grey neutrals. */
:root {
  --bg: #f4f6f2;
  --surface: #ffffff;
  --surface-2: #edf0ea;
  --line: #dde2d9;
  --ink: #15201b;
  --ink-2: #47524c;
  --ink-3: #6e7a73;
  --accent: #1d6b57;
  --accent-ink: #ffffff;
  --accent-soft: #e1eee8;
  --accent-text: #175846;
  --good: #0ca30c; --good-text: #006300;
  --warning: #fab219; --warning-text: #7a5300; --warning-soft: #fff4d6;
  --serious: #ec835a; --serious-text: #a2441c;
  --critical: #d03b3b; --critical-text: #b42f2f; --critical-soft: #fbe7e5;
  --shadow: 0 1px 2px rgba(20, 40, 30, .05);
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #191e1c; --surface-2: #212725; --line: #2e3532;
    --ink: #eef2ef; --ink-2: #bfc8c3; --ink-3: #8d9892;
    --accent: #4fb595; --accent-ink: #07130e; --accent-soft: #1b2d26; --accent-text: #7fd0b4;
    --good-text: #4cc94c; --warning-text: #fab219; --warning-soft: #2e2713; --serious-text: #f0a07f;
    --critical-text: #ef7a7a; --critical-soft: #331c1c; --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #191e1c; --surface-2: #212725; --line: #2e3532;
  --ink: #eef2ef; --ink-2: #bfc8c3; --ink-3: #8d9892;
  --accent: #4fb595; --accent-ink: #07130e; --accent-soft: #1b2d26; --accent-text: #7fd0b4;
  --good-text: #4cc94c; --warning-text: #fab219; --warning-soft: #2e2713; --serious-text: #f0a07f;
  --critical-text: #ef7a7a; --critical-soft: #331c1c; --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 64px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 16px; font-weight: 650; }
h3 { font-size: 14px; font-weight: 650; }
p { margin: 0; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }

.topbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.brand { display: flex; gap: 12px; align-items: center; min-width: 0; }
.brand .mark { width: 36px; height: 36px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; flex: none; }
.brand .sub { color: var(--ink-3); font-size: 12.5px; }
.who { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.who img { width: 26px; height: 26px; border-radius: 50%; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tabs button { border: 0; background: none; font: inherit; color: var(--ink-2); padding: 9px 12px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.stack { display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { justify-content: space-between; }
.spacer { flex: 1; }
.grid-kpi { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
.kpi .v { font-size: 24px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 12.5px; color: var(--ink-2); }
.kpi .n { font-size: 12px; color: var(--ink-3); }

input[type=text], input[type=number], input[type=date], input[type=month], input[type=search], select, textarea {
  font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 9px; min-width: 0; max-width: 100%;
}
textarea { width: 100%; resize: vertical; line-height: 1.45; }
input:disabled, select:disabled, textarea:disabled { background: var(--surface-2); color: var(--ink-2); }
label.f { display: grid; gap: 3px; font-size: 12px; color: var(--ink-3); min-width: 0; }
label.f > * { width: 100%; }
.btn { font: inherit; font-size: 13.5px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 13px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--critical-text); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.accent { background: var(--accent-soft); color: var(--accent-text); }
.st { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13px; color: var(--ink-2); }
.st svg { flex: none; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); font-size: 13px; }
.notice.warn { background: var(--warning-soft); }
.notice.bad { background: var(--critical-soft); }
.notice.ok { background: var(--accent-soft); }
.notice svg { flex: none; margin-top: 2px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; font-weight: 500; color: var(--ink-3); white-space: nowrap; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
td.c, th.c { text-align: center; }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
.scroll { overflow-x: auto; }
.bar { display: inline-flex; align-items: center; gap: 6px; }
.bar i { width: 56px; height: 6px; border-radius: 3px; background: var(--surface-2); position: relative; overflow: hidden; display: block; }
.bar i b { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }

/* Task cards */
.group-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); font-weight: 600; font-size: 13px; }
.task { border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; background: var(--surface); }
.task[data-tt="xong"] { border-left-color: var(--good); }
.task[data-tt="dang"] { border-left-color: var(--accent); }
.task[data-tt="khong"] { border-left-color: var(--critical); }
.task.late { border-left-color: var(--critical); }
.task-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.task-fields { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.task-fields .w2 { grid-column: span 2; }
.task-fields .w4 { grid-column: span 4; }
.prog { display: flex; align-items: center; gap: 8px; }
.prog input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
.prog output { width: 42px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.ev { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.ev-item { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px 5px 5px; background: var(--surface); max-width: 100%; min-width: 0; }
.ev-item .thumb { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: var(--surface-2); flex: none; cursor: zoom-in; border: 0; padding: 0; }
.ev-item .ficon { width: 44px; height: 44px; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--ink-2); flex: none; }
.ev-item .meta { min-width: 0; display: grid; }
.ev-item .meta a, .ev-item .meta span.nm { font-size: 12.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.ev-item .meta a { color: var(--accent-text); }
.ev-item .meta small { font-size: 11.5px; color: var(--ink-3); }
.drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: 12.5px; cursor: pointer; background: none; font-family: inherit; }
.drop:hover, .drop.over { border-color: var(--accent); color: var(--accent-text); }
.review { border-radius: 8px; padding: 8px 10px; background: var(--warning-soft); font-size: 13px; color: var(--ink); }
.review.ok { background: var(--accent-soft); }

.matrix td { text-align: center; padding: 6px 4px; }
.matrix td:first-child, .matrix th:first-child { text-align: left; white-space: nowrap; }
.cell { display: inline-flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11px; color: var(--ink-3); }

.log { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
.log li { display: flex; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.log li:last-child { border-bottom: 0; }
.log time { color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }

.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: grid; place-items: center; z-index: 60; padding: 24px; }
.lightbox img { max-width: 100%; max-height: 86vh; border-radius: 8px; }
.lightbox .cap { color: #fff; margin-top: 8px; font-size: 13px; text-align: center; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 70; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; }
.empty { text-align: center; padding: 28px 16px; color: var(--ink-3); }
.empty h2 { color: var(--ink); margin-bottom: 6px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--ink-2); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }

@media (max-width: 980px) { .grid-kpi { grid-template-columns: repeat(3, minmax(0, 1fr)); } .two { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 720px) {
  .task-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .task-fields .w2, .task-fields .w4 { grid-column: span 2; }
}
@media (max-width: 460px) { .grid-kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi .v { font-size: 20px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">TĐ</div>
      <div style="min-width:0">
        <h1>Sổ tiến độ nhiệm vụ</h1>
        <p class="sub" id="schoolLine">Cập nhật tiến độ và minh chứng hằng tháng</p>
      </div>
    </div>
    <div class="who" id="who"></div>
  </header>
  <nav class="tabs" id="tabs" hidden></nav>
  <main id="main">
    <div class="panel empty"><h2>Đang mở sổ…</h2><p>Đang kết nối dữ liệu dùng chung của nhà trường.</p></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script>
(() => {
"use strict";

// ---------------------------------------------------------------- constants
const GROUPS = [
  [1, "I. Nhiệm vụ theo chương trình, kế hoạch"],
  [2, "II. Nhiệm vụ chuyên môn, thường xuyên"],
  [3, "III. Nhiệm vụ đột xuất, phát sinh"],
  [4, "IV. Nhiệm vụ khác (họp, tập huấn, bồi dưỡng…)"],
];
const TT = { chua: "Chưa bắt đầu", dang: "Đang thực hiện", xong: "Hoàn thành", khong: "Không hoàn thành" };
const TC = { bt: "Bình thường", pt: "Phức tạp", rpt: "Rất phức tạp" };
const MD = { chu: "Chủ trì", phoi: "Phối hợp" };
const CL = { chua: "Chưa đảm bảo", dam: "Đảm bảo", vuot: "Vượt mức" };
const TYPES = { gvcn: "GV chủ nhiệm", gvbm: "GV bộ môn", cbnv: "BGH, TPT, NV" };
const ACCEPT = ["image/png", "image/jpeg", "image/gif", "image/webp", "application/pdf", "video/mp4", "video/webm", "text/plain", "text/csv"];
const EXT_TYPE = { png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp", pdf: "application/pdf", mp4: "video/mp4", webm: "video/webm", txt: "text/plain", csv: "text/csv" };

const ICON = {
  good: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="7" fill="var(--good)"/><path d="M4 7.2l2 2 4-4.2" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  warning: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="7" fill="var(--warning)"/><path d="M7 3.6V7l2.2 1.4" stroke="#3a2a00" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>',
  serious: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="7" fill="var(--serious)"/><circle cx="4.2" cy="7" r="1" fill="#fff"/><circle cx="7" cy="7" r="1" fill="#fff"/><circle cx="9.8" cy="7" r="1" fill="#fff"/></svg>',
  critical: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="7" fill="var(--critical)"/><path d="M7 3.5v4.2" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><circle cx="7" cy="10.2" r="1" fill="#fff"/></svg>',
  none: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="2 2"/></svg>',
};
const STATUS = {
  chuadk: ["none", "Chưa có tài khoản"],
  chuatao: ["critical", "Chưa cập nhật"],
  dang: ["serious", "Đang cập nhật"],
  trehan: ["critical", "Quá hạn, chưa nộp"],
  cho: ["warning", "Chờ duyệt"],
  nopLai: ["warning", "Đã nộp lại, chờ duyệt"],
  tralai: ["serious", "Đã trả lại để bổ sung"],
  duyet: ["good", "Đã duyệt"],
};
const stHtml = k => `<span class="st">${ICON[STATUS[k][0]]}${STATUS[k][1]}</span>`;

// ---------------------------------------------------------------- helpers
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const stable = o => JSON.stringify(o, (k, v) => v && typeof v === "object" && !Array.isArray(v) ? Object.keys(v).sort().reduce((a, x) => (a[x] = v[x], a), {}) : v);
const pad = n => String(n).padStart(2, "0");
const now = () => new Date();
const ymOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const todayStr = () => { const d = now(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const addMonth = (k, n) => { let [y, m] = k.split("-").map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; };
const monthLabel = k => { const [y, m] = k.split("-").map(Number); return `Tháng ${m}/${y}`; };
const monthShort = k => { const [y, m] = k.split("-").map(Number); return `T${m}`; };
const lastDay = k => { const [y, m] = k.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const fmtDate = s => { if (!s) return ""; const [y, m, d] = s.split("-"); return `${+d}/${+m}/${y}`; };
const fmtTime = iso => iso ? new Date(iso).toLocaleString("vi-VN", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit", year: "numeric" }) : "";
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
const pct = v => v == null || isNaN(v) ? "–" : Math.round(v) + "%";
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const schoolYearOf = k => { const [y, m] = k.split("-").map(Number); return m >= 9 ? y : y - 1; };
const syMonths = y => [9, 10, 11, 12].map(m => `${y}-${pad(m)}`).concat([1, 2, 3, 4, 5, 6, 7, 8].map(m => `${y + 1}-${pad(m)}`));

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 3200); }

// ---------------------------------------------------------------- state
const S = {
  ready: false, db: null, user: null, assets: null, downloads: null,
  uid: null, me: null, isOwner: false, readOnly: false,
  school: { name: "", donVi: "", deadlineDay: 25, deadlineNext: false },
  roster: [], common: {},
  myProfile: undefined, myReviewSum: null,
  tab: "mine", month: ymOf(now()),
  M: undefined, R: null, dirty: false, saveState: "",
  reports: new Map(), reviews: new Map(), profiles: {},
  mView: "month", mMonth: ymOf(now()), detail: null, detailDoc: undefined, detailReview: null, assetTimes: null,
  setupMonth: ymOf(now()), rosterDraft: null, commonDraft: null,
};
const subs = {};
function resub(key, fn) { if (subs[key]) { subs[key](); delete subs[key]; } if (fn) subs[key] = fn(); }

const deadlineOf = ym => {
  const k = S.school.deadlineNext ? addMonth(ym, 1) : ym;
  const d = Math.min(S.school.deadlineDay || 25, lastDay(k));
  return `${k}-${pad(d)}`;
};

// serialised writes per path
const queues = new Map();
function write(path, fn) {
  const prev = queues.get(path) || Promise.resolve();
  const p = prev.catch(() => {}).then(fn);
  queues.set(path, p);
  return p;
}
function dbError(e, what) {
  console.warn(what, e);
  if (e && e.code === "invalid_argument") { S.readOnly = true; toast("Tài khoản của bạn chưa được phép ghi dữ liệu. Hãy nhờ BGH cấp quyền."); render(); }
  else if (e && e.code === "quota_exceeded") toast("Kho dữ liệu đã đầy. Hãy báo BGH.");
  else toast("Chưa lưu được, đang thử lại khi bạn sửa tiếp. (" + (e?.code || "lỗi") + ")");
}

// ---------------------------------------------------------------- task maths
function taskTiming(t, ym) {
  const due = t.han || deadlineOf(ym);
  if (t.tt === "xong") {
    if (!t.ngayXong) return { k: "dung", d: 0 };
    const d = daysBetween(due, t.ngayXong);
    return d < 0 ? { k: "som", d } : d === 0 ? { k: "dung", d } : { k: "tre", d };
  }
  if (t.tt !== "khong" && todayStr() > due) return { k: "quahan", d: daysBetween(due, todayStr()) };
  return { k: "", d: 0 };
}
function summarize(M) {
  const s = { n: 0, xong: 0, dang: 0, chua: 0, khong: 0, som: 0, dung: 0, tre: 0, quahan: 0, ev: 0, thieuEv: 0, pctSum: 0 };
  for (const t of M.tasks) {
    s.n++; s[t.tt] = (s[t.tt] || 0) + 1;
    const p = t.tt === "xong" ? 100 : (t.pct || 0); s.pctSum += p;
    const tm = taskTiming(t, M.ym); if (tm.k) s[tm.k]++;
    const ne = (t.ev || []).length; s.ev += ne; if (t.tt === "xong" && !ne) s.thieuEv++;
  }
  return { n: s.n, xong: s.xong, dang: s.dang, chua: s.chua, khong: s.khong, som: s.som, dung: s.dung, tre: s.tre, quahan: s.quahan, ev: s.ev, thieuEv: s.thieuEv,
    pct: s.n ? Math.round(s.pctSum / s.n) : 0, status: M.status, submittedAt: M.submittedAt || null, updatedAt: M.updatedAt || null };
}
function statusFor(profile, ym, reviewSum) {
  if (!profile) return "chuadk";
  const s = profile.months?.[ym];
  const rv = reviewSum?.months?.[ym];
  if (!s) return todayStr() > deadlineOf(ym) ? "trehan" : "chuatao";
  if (s.status !== "nop") {
    if (rv?.status === "tralai") return "tralai";
    return todayStr() > deadlineOf(ym) ? "trehan" : "dang";
  }
  if (rv && rv.at >= s.submittedAt) return rv.status === "duyet" ? "duyet" : "tralai";
  return rv ? "nopLai" : "cho";
}
function submitTiming(sum, ym) {
  if (!sum?.submittedAt) return null;
  const d = daysBetween(deadlineOf(ym), sum.submittedAt.slice(0, 10));
  return d <= 0 ? { ok: true, txt: "Đúng hạn" } : { ok: false, txt: `Trễ ${d} ngày` };
}

// ---------------------------------------------------------------- boot
async function boot() {
  const c = window.claude;
  if (!c || !c.use) { renderNoAccess("Hãy mở trang này từ đường link Claude mà nhà trường đã chia sẻ cho bạn."); return; }
  const [db, user, assets, downloads] = await Promise.all(["db", "user", "assets", "downloads"].map(n => c.use(n).catch(() => null)));
  S.db = db; S.user = user; S.assets = assets; S.downloads = downloads;
  if (!db) { renderNoAccess("Bạn cần đăng nhập Claude bằng đúng email mà nhà trường đã mời để dùng sổ này."); return; }
  if (user) {
    S.me = await user.me();
    S.uid = S.me.id;
    S.isOwner = S.me.isOwner;
  }
  S.tab = S.isOwner ? "manage" : "mine";
  try { const t = sessionStorage.getItem("std-tab"); if (t && S.isOwner) S.tab = t; } catch (e) {}

  resub("school", () => db.doc("config/school").onSnapshot(s => { if (s.exists) S.school = { ...S.school, ...s.data() }; render(); }, e => console.warn(e)));
  resub("roster", () => db.doc("config/roster").onSnapshot(s => { S.roster = s.exists ? (s.data().staff || []) : []; render(); }, e => console.warn(e)));
  resub("common", () => db.doc("config/common").onSnapshot(s => { S.common = s.exists ? (s.data().months || {}) : {}; if (S.tab === "setup") return; render(); }, e => console.warn(e)));
  if (S.uid) {
    resub("myProfile", () => db.doc(`reports/${S.uid}`).onSnapshot(s => { S.myProfile = s.exists ? s.data() : null; render(); }, e => console.warn(e)));
    resub("myReviewSum", () => db.doc(`reviews/${S.uid}`).onSnapshot(s => { S.myReviewSum = s.exists ? s.data() : null; if (S.tab === "mine") render(); }, e => console.warn(e)));
    subMonth();
  }
  if (S.isOwner) {
    resub("reports", () => db.collection("reports").onSnapshot(q => { S.reports = new Map(q.docs.map(d => [d.id, d.data()])); refreshProfiles(); render(); }, e => console.warn(e)));
    resub("reviews", () => db.collection("reviews").onSnapshot(q => { S.reviews = new Map(q.docs.map(d => [d.id, d.data()])); render(); }, e => console.warn(e)));
  }
  S.ready = true;
  render();
}
async function refreshProfiles() {
  if (!S.user) return;
  const ids = [...S.reports.keys()];
  if (!ids.length) return;
  S.profiles = await S.user.profiles(ids);
  render();
}

function subMonth() {
  if (!S.uid) return;
  const ym = S.month;
  S.M = undefined; S.R = null; S.dirty = false;
  resub("month", () => S.db.doc(`reports/${S.uid}/months/${ym}`).onSnapshot(s => {
    if (ym !== S.month) return;
    if (S.dirty || s.metadata.hasPendingWrites) return;
    const data = s.exists ? s.data() : null;
    if (S.M !== undefined && stable(data) === stable(S.M)) return;
    S.M = data ? clone(data) : null;
    if (S.tab === "mine") render();
  }, e => console.warn(e)));
  resub("review", () => S.db.doc(`reviews/${S.uid}/months/${ym}`).onSnapshot(s => {
    if (ym !== S.month) return;
    S.R = s.exists ? s.data() : null;
    if (S.tab === "mine" && !document.activeElement?.closest?.(".task")) render();
  }, e => console.warn(e)));
}

// ---------------------------------------------------------------- teacher saving
let saveTimer;
function scheduleSave(immediate) {
  S.dirty = true; setSaveState("Đang lưu…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, immediate ? 0 : 900);
}
async function flush() {
  if (!S.M || S.readOnly) return;
  const ym = S.M.ym, uidv = S.uid;
  S.M.updatedAt = now().toISOString();
  const snap = clone(S.M);
  const mp = `reports/${uidv}/months/${ym}`, pp = `reports/${uidv}`;
  try {
    await write(mp, () => S.db.doc(mp).set(snap));
    const sum = summarize(snap);
    await write(pp, () => S.db.doc(pp).update({ months: { [ym]: sum }, lastActive: snap.updatedAt }));
    if (stable(snap) === stable({ ...S.M, updatedAt: snap.updatedAt })) S.dirty = false;
    setSaveState("Đã lưu lúc " + new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }));
  } catch (e) { setSaveState("Chưa lưu được"); dbError(e, "save"); }
}
function setSaveState(t) { S.saveState = t; const el = $("#saveState"); if (el) el.textContent = t; }
function logAction(a) { S.M.log = (S.M.log || []).concat({ at: now().toISOString(), a }).slice(-200); }

// evidence upload
async function prepareFile(f) {
  let type = f.type;
  const ext = (f.name.split(".").pop() || "").toLowerCase();
  if (!ACCEPT.includes(type)) type = EXT_TYPE[ext] || "";
  if (!type) throw new Error(`“${f.name}”: định dạng .${ext} chưa hỗ trợ. Hãy lưu thành PDF hoặc chụp ảnh.`);
  if (type === "image/jpeg" || type === "image/png" || type === "image/webp") {
    if (f.size > 900 * 1024) {
      try {
        const bmp = await createImageBitmap(f);
        const k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
        const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
        cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
        const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.82));
        if (blob && blob.size < f.size) return { blob, type: "image/jpeg", name: f.name.replace(/\.\w+$/, "") + ".jpg" };
      } catch (e) { /* keep original */ }
    }
  }
  if (f.size > 20 * 1048576) throw new Error(`“${f.name}” lớn hơn 20 MB. Hãy nén hoặc chia nhỏ.`);
  return { blob: f, type, name: f.name };
}
async function uploadFiles(taskId, files) {
  if (!S.assets) { toast("Tài khoản chưa có quyền tải minh chứng."); return; }
  for (const f of files) {
    const t = S.M.tasks.find(x => x.id === taskId); if (!t) return;
    let p;
    try { p = await prepareFile(f); } catch (e) { toast(e.message); continue; }
    setSaveState(`Đang tải “${p.name}”…`);
    try {
      const res = await S.assets.upload(p.blob, { type: p.type });
      t.ev = (t.ev || []).concat({ id: res.id, name: p.name, size: res.sizeBytes, type: res.contentType, at: now().toISOString() });
      logAction(`Tải minh chứng “${p.name}” cho nhiệm vụ: ${t.nd.slice(0, 60) || "(chưa đặt tên)"}`);
      renderMine(); scheduleSave(true);
    } catch (e) {
      const m = { too_large: "tệp quá lớn (tối đa 20 MB)", unsupported_type: "định dạng không hỗ trợ", quota_or_state: "kho minh chứng đã đầy, hãy báo BGH", rate_limited: "tải quá nhanh, thử lại sau ít phút", not_granted: "chưa có quyền tải lên" }[e?.code] || "lỗi tải lên";
      toast(`Không tải được “${p.name}”: ${m}.`); setSaveState("");
    }
  }
}

// ---------------------------------------------------------------- owner: monitoring
function staffRows() {
  const rows = [];
  const byRoster = new Map();
  for (const [id, p] of S.reports) if (p.rosterId) { if (!byRoster.has(p.rosterId)) byRoster.set(p.rosterId, []); byRoster.get(p.rosterId).push(id); }
  for (const r of S.roster) {
    const ids = byRoster.get(r.id) || [];
    if (!ids.length) rows.push({ key: "r:" + r.id, name: r.name, chucVu: r.chucVu, to: r.to, lop: r.lop, uid: null, p: null, dup: false });
    ids.forEach(id => { const p = S.reports.get(id); rows.push({ key: id, name: p.name, chucVu: p.chucVu || r.chucVu, to: p.to || r.to, lop: p.lop || r.lop, uid: id, p, dup: ids.length > 1 }); });
  }
  for (const [id, p] of S.reports) if (!p.rosterId || !S.roster.some(r => r.id === p.rosterId)) rows.push({ key: id, name: p.name, chucVu: p.chucVu, to: p.to, lop: p.lop, uid: id, p, extra: true });
  rows.sort((a, b) => (a.to || "").localeCompare(b.to || "", "vi") || a.name.split(" ").pop().localeCompare(b.name.split(" ").pop(), "vi"));
  return rows;
}

    <div class="kpi"><div class="l">Minh chứng</div><div class="v">${sum.ev}</div><div class="n">${sum.thieuEv} việc xong thiếu</div></div>

async function saveReview(status) {
  const uidv = S.detail, ym = S.mMonth;
  const tasks = {};
  $$("[data-rvf]").forEach(el => { const t = tasks[el.dataset.tid] ||= {}; if (el.value) t[el.dataset.rvf] = el.value; });
  for (const k of Object.keys(tasks)) if (!Object.keys(tasks[k]).length) delete tasks[k];
  const at = now().toISOString();
  const doc = { status, note: $("#rvNote").value.trim(), tasks, at };
  const sumDoc = clone(S.reviews.get(uidv) || {}); sumDoc.months = { ...(sumDoc.months || {}), [ym]: { status, at } };
  try {
    await write(`reviews/${uidv}/months/${ym}`, () => S.db.doc(`reviews/${uidv}/months/${ym}`).set(doc));
    await write(`reviews/${uidv}`, () => S.db.doc(`reviews/${uidv}`).set(sumDoc));
    S.detailReview = doc;
    toast(status === "duyet" ? "Đã duyệt báo cáo." : "Đã trả lại. Giáo viên sẽ thấy góp ý khi mở sổ.");
    renderDetail();
  } catch (e) { dbError(e, "review"); }
}

async function exportExcel() {
  if (!window.XLSX) { toast("Chưa tải xong thư viện Excel, hãy thử lại sau vài giây."); return; }
  const ym = S.mMonth, rows = staffRows();
  const sheet1 = [[S.school.name || "", "", "", "", `BÁO CÁO TIẾN ĐỘ THỰC HIỆN NHIỆM VỤ – ${monthLabel(ym).toUpperCase()}`], [],
    ["TT", "Họ và tên", "Chức vụ", "Tổ", "Trạng thái", "Nộp lúc", "Đúng hạn nộp", "Được giao", "Hoàn thành", "Đang làm", "Chưa bắt đầu", "Không HT", "Sớm hạn", "Đúng hạn", "Trễ hạn", "Quá hạn chưa xong", "Tiến độ chung (%)", "Số minh chứng", "Việc xong thiếu MC", "Cập nhật gần nhất"]];
  rows.forEach((r, i) => {
    const s = r.p?.months?.[ym], st = statusFor(r.p, ym, r.uid ? S.reviews.get(r.uid) : null), tm = submitTiming(s, ym);
    sheet1.push([i + 1, r.name, r.chucVu || "", r.to || "", STATUS[st][1], s?.submittedAt ? fmtTime(s.submittedAt) : "", tm ? tm.txt : "",
      s?.n ?? "", s?.xong ?? "", s?.dang ?? "", s?.chua ?? "", s?.khong ?? "", s?.som ?? "", s?.dung ?? "", s?.tre ?? "", s?.quahan ?? "", s?.pct ?? "", s?.ev ?? "", s?.thieuEv ?? "", s?.updatedAt ? fmtTime(s.updatedAt) : ""]);
  });
  const sheet2 = [["Họ và tên", "Tổ", "Nhóm", "Nội dung nhiệm vụ", "Tính chất", "Vai trò", "Hạn", "Trạng thái", "% hoàn thành", "Ngày xong", "Tiến độ", "Tự đánh giá CL", "BGH đánh giá CL", "Kết quả / lý do", "Số minh chứng"]];
  toast("Đang tổng hợp chi tiết nhiệm vụ…");
  for (const r of rows) {
    if (!r.uid || !r.p?.months?.[ym]) continue;
    try {
      const [m, rv] = await Promise.all([S.db.doc(`reports/${r.uid}/months/${ym}`).get(), S.db.doc(`reviews/${r.uid}/months/${ym}`).get()]);
      if (!m.exists) continue;
      const M = m.data(), R = rv.exists ? rv.data() : null;
      for (const t of M.tasks) {
        const tm = taskTiming(t, ym);
        sheet2.push([r.name, r.to || "", ["I", "II", "III", "IV"][t.g - 1], t.nd, TC[t.tc], MD[t.md], fmtDate(t.han), TT[t.tt], t.tt === "xong" ? 100 : (t.pct || 0), fmtDate(t.ngayXong),
          { som: "Sớm hạn", dung: "Đúng hạn", tre: `Trễ ${tm.d} ngày`, quahan: `Quá hạn ${tm.d} ngày` }[tm.k] || "", t.tt === "xong" ? CL[t.cl || "dam"] : "", R?.tasks?.[t.id]?.cl ? CL[R.tasks[t.id].cl] : "", t.kq || "", (t.ev || []).length]);
      }
    } catch (e) { /* skip */ }
  }
  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet(sheet1); ws1["!cols"] = [5, 24, 16, 12, 22, 16, 12, 9, 10, 9, 11, 9, 8, 8, 8, 13, 12, 11, 13, 16].map(w => ({ wch: w }));
  const ws2 = XLSX.utils.aoa_to_sheet(sheet2); ws2["!cols"] = [22, 10, 6, 50, 12, 10, 11, 16, 10, 11, 14, 14, 14, 40, 10].map(w => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, ws1, "Tong hop");
  XLSX.utils.book_append_sheet(wb, ws2, "Chi tiet nhiem vu");
  const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  try { await S.downloads.save({ filename: `Tien_do_nhiem_vu_${ym}.xlsx`, data: new Uint8Array(buf) }); toast("Đã lưu tệp Excel."); }
  catch (e) { if (e?.code !== "declined") toast("Không lưu được tệp (" + (e?.code || "lỗi") + ")."); }
}

// ---------------------------------------------------------------- events
document.addEventListener("click", async ev => {
  const tabB = ev.target.closest("[data-tab]");
  if (tabB) { S.tab = tabB.dataset.tab; S.detail = null; resub("detail"); try { sessionStorage.setItem("std-tab", S.tab); } catch (e) {} render(); window.scrollTo(0, 0); return; }
  const open = ev.target.closest("tr[data-open]");
  if (open) { openDetail(open.dataset.open); window.scrollTo(0, 0); return; }
  const yc = ev.target.closest("[data-ycell]");
  if (yc) { S.mView = "month"; openDetail(yc.dataset.ycell, yc.dataset.m); window.scrollTo(0, 0); return; }
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  const card = b.closest("[data-tid]");
  const task = card && S.M ? S.M.tasks.find(t => t.id === card.dataset.tid) : null;
  switch (act) {
    case "prevMonth": case "nextMonth": if (S.dirty) await flush(); S.month = addMonth(S.month, act === "prevMonth" ? -1 : 1); subMonth(); render(); break;
    case "createMonth": case "createFromPrev": {
      const P = S.myProfile, ym = S.month;
      let tasks = commonFor(ym, P.type).map(c => newTask(c.g, { nd: c.nd, han: c.han || deadlineOf(ym), chung: true, cid: c.id }));
      if (act === "createFromPrev") {
        try { const p = await S.db.doc(`reports/${S.uid}/months/${addMonth(ym, -1)}`).get(); if (p.exists) tasks = tasks.concat(p.data().tasks.filter(t => !t.chung).map(t => newTask(t.g, { nd: t.nd, tc: t.tc, md: t.md }))); else toast("Tháng trước chưa có báo cáo để chép."); } catch (e) {}
      }
      S.M = { ym, tasks, status: "nhap", createdAt: now().toISOString(), log: [] };
      logAction(`Tạo báo cáo ${monthLabel(ym).toLowerCase()} (${tasks.length} nhiệm vụ)`);
      if (!tasks.length) S.M.tasks.push(newTask(1));
      renderMine(); scheduleSave(true); break;
    }
    case "copyPrev": {
      try {
        const p = await S.db.doc(`reports/${S.uid}/months/${addMonth(S.month, -1)}`).get();
        if (!p.exists) { toast("Tháng trước chưa có báo cáo."); break; }
        const add = p.data().tasks.filter(t => !t.chung).map(t => newTask(t.g, { nd: t.nd, tc: t.tc, md: t.md }));
        S.M.tasks.push(...add); logAction(`Chép ${add.length} nhiệm vụ từ tháng trước`); renderMine(); scheduleSave(); toast(`Đã chép ${add.length} nhiệm vụ.`);
      } catch (e) { toast("Không đọc được tháng trước."); }
      break;
    }
    case "addTask": { const t = newTask(+b.dataset.g); S.M.tasks.push(t); logAction("Thêm nhiệm vụ mới"); renderMine(); scheduleSave(); setTimeout(() => $(`[data-tid="${t.id}"] textarea`)?.focus(), 0); break; }
    case "delTask": {
      if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Bấm lần nữa để xoá"; setTimeout(() => { if (b.isConnected) { b.dataset.confirm = ""; b.textContent = "Xoá"; } }, 3500); break; }
      S.M.tasks = S.M.tasks.filter(t => t !== task); logAction(`Xoá nhiệm vụ: ${task.nd.slice(0, 60) || "(trống)"}`); renderMine(); scheduleSave(); break;
    }
    case "pick": {
      const inp = document.createElement("input"); inp.type = "file"; inp.multiple = true; inp.accept = "image/*,application/pdf,video/mp4,video/webm,.txt,.csv";
      inp.onchange = () => uploadFiles(card.dataset.tid, [...inp.files]); inp.click(); break;
    }
    case "delEv": {
      const id = b.closest("[data-eid]").dataset.eid;
      if (b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Xoá?"; setTimeout(() => { if (b.isConnected) { b.dataset.confirm = ""; b.textContent = "✕"; } }, 3500); break; }
      const e = task.ev.find(x => x.id === id);
      task.ev = task.ev.filter(x => x.id !== id); logAction(`Xoá minh chứng “${e?.name || ""}”`); renderMine(); scheduleSave(true);
      S.assets?.delete(id).catch(() => {});
      break;
    }
    case "zoom": {
      const lb = document.createElement("div"); lb.className = "lightbox"; lb.setAttribute("role", "dialog");
      lb.innerHTML = `<div><img alt=""><div class="cap"></div></div>`; lb.querySelector("img").src = b.dataset.src; lb.querySelector(".cap").textContent = b.dataset.name + " · bấm để đóng";
      lb.addEventListener("click", () => lb.remove()); document.body.appendChild(lb); break;
    }
    case "submit": {
      const s = summarize(S.M);
      if (!S.M.tasks.length) { toast("Báo cáo chưa có nhiệm vụ nào."); break; }
      const empty = S.M.tasks.filter(t => !t.nd.trim()).length;
      if (empty) { toast(`Còn ${empty} nhiệm vụ chưa ghi nội dung.`); break; }
      if (s.thieuEv && b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = `Còn ${s.thieuEv} việc xong thiếu minh chứng – vẫn nộp`; break; }
      const re = !!S.M.submittedAt;
      S.M.status = "nop"; S.M.submittedAt = now().toISOString(); logAction(re ? "Nộp lại báo cáo" : "Nộp báo cáo");
      await flush(); toast(re ? "Đã nộp lại báo cáo." : "Đã nộp báo cáo. BGH sẽ xem và duyệt."); render(); break;
    }
    case "withdraw": S.M.status = "nhap"; logAction("Rút lại báo cáo để sửa"); await flush(); render(); break;
    case "editProfile": S.editingProfile = clone(S.myProfile); S.myProfile = null; render(); break;
    case "mView": S.mView = b.dataset.v; renderManage(); break;
    case "mPrev": case "mNext": S.mMonth = addMonth(S.mMonth, act === "mPrev" ? -1 : 1); renderManage(); break;
    case "closeDetail": closeDetail(); break;
    case "dPrev": case "dNext": openDetail(S.detail, addMonth(S.mMonth, act === "dPrev" ? -1 : 1)); break;
    case "review": saveReview(b.dataset.s); break;
    case "export": exportExcel(); break;
    case "usage": try { const l = await S.assets.list(); $("#usage").textContent = `${l.usage.files} tệp · ${fmtSize(l.usage.bytes)} / ${fmtSize(l.usage.maxBytes)}`; } catch (e) { $("#usage").textContent = "Không đọc được."; } break;
    case "rosterAdd": S.rosterDraft.push({ id: uid(), name: "", chucVu: "Giáo viên", to: "", lop: "", type: "gvcn" }); renderSetup(); setTimeout(() => { const i = $$('[data-rf="name"]'); i[i.length - 1]?.focus(); }, 0); break;
    case "rosterDel": S.rosterDraft.splice(+b.closest("[data-ri]").dataset.ri, 1); renderSetup(); break;
    case "rosterPaste": {
      const lines = $("#paste").value.split(/\r?\n/).map(l => l.split("\t").map(x => x.trim())).filter(c => c[0] && !/họ.*tên/i.test(c[0]));
      for (const c of lines) {
        const k = (c[4] || "").toLowerCase();
        const type = /bm|bộ môn/.test(k) ? "gvbm" : /cbnv|nv|bgh/.test(k) || /hiệu|kế toán|thư viện|tổng phụ trách|nhân viên|văn thư|y tế|bảo vệ/i.test(c[1] || "") ? "cbnv" : "gvcn";
        S.rosterDraft.push({ id: uid(), name: c[0], chucVu: c[1] || "Giáo viên", to: c[2] || "", lop: c[3] || "", type });
      }
      toast(`Đã thêm ${lines.length} người. Nhớ bấm “Lưu danh sách”.`); renderSetup(); break;
    }
    case "rosterSave": {
      const list = S.rosterDraft.filter(r => r.name.trim()).map(r => ({ ...r, name: r.name.trim() }));
      try { await write("config/roster", () => S.db.doc("config/roster").set({ staff: list })); S.roster = clone(list); S.rosterDraft = clone(list); toast("Đã lưu danh sách."); renderSetup(); } catch (e) { dbError(e, "roster"); }
      break;
    }
    case "commonAdd": S.commonDraft.list.push({ id: uid(), g: 1, nd: "", han: deadlineOf(S.setupMonth), types: [] }); renderSetup(); break;
    case "commonDel": S.commonDraft.list.splice(+b.closest("[data-ci]").dataset.ci, 1); renderSetup(); break;
    case "commonSave": {
      const months = { ...S.common, [S.setupMonth]: S.commonDraft.list.filter(c => c.nd.trim()) };
      try { await write("config/common", () => S.db.doc("config/common").set({ months })); S.common = months; S.commonDraft = null; toast("Đã lưu nhiệm vụ chung."); renderSetup(); } catch (e) { dbError(e, "common"); }
      break;
    }
  }
});

document.addEventListener("input", ev => {
  const el = ev.target;
  if (S.tab === "mine" && S.M) {
    const card = el.closest("[data-tid]"); if (!card || !el.dataset.f) return;
    const t = S.M.tasks.find(x => x.id === card.dataset.tid); if (!t) return;
    const f = el.dataset.f;
    if (f === "pct") { t.pct = +el.value; el.nextElementSibling.textContent = el.value + "%"; if (t.pct > 0 && t.tt === "chua") t.tt = "dang"; scheduleSave(); return; }
    if (["nd", "kq"].includes(f)) { t[f] = el.value; scheduleSave(); return; }
  }
  if (S.tab === "setup") {
    const r = el.closest("[data-ri]"); if (r && el.dataset.rf) { S.rosterDraft[+r.dataset.ri][el.dataset.rf] = el.value; return; }
    const c = el.closest("[data-ci]"); if (c && el.dataset.cf) { const it = S.commonDraft.list[+c.dataset.ci]; it[el.dataset.cf] = el.dataset.cf === "g" ? +el.value : el.dataset.cf === "types" ? (el.value ? [el.value] : []) : el.value; return; }
  }
});
document.addEventListener("change", async ev => {
  const el = ev.target;
  if (el.id === "mMonth" && el.value) { if (S.dirty) await flush(); S.month = el.value; subMonth(); render(); return; }
  if (el.id === "mgMonth" && el.value) { S.mMonth = el.value; renderManage(); return; }
  if (el.id === "mgYear") { S.mMonth = `${el.value}-09`; renderManage(); return; }
  if (el.id === "cMonth" && el.value) { S.setupMonth = el.value; S.commonDraft = null; renderSetup(); return; }
  if (S.tab === "setup" && (el.dataset.rf || el.dataset.cf)) { renderSetup(); return; }
  if (S.tab === "mine" && S.M) {
    const card = el.closest("[data-tid]"); if (!card || !el.dataset.f) return;
    const t = S.M.tasks.find(x => x.id === card.dataset.tid); if (!t) return;
    const f = el.dataset.f;
    if (["nd", "kq", "pct"].includes(f)) { if (f === "pct") renderMine(); return; }
    const old = t[f];
    t[f] = f === "g" ? +el.value : el.value;
    if (f === "tt") {
      if (t.tt === "xong") { t.pct = 100; if (!t.ngayXong) t.ngayXong = todayStr(); }
      else if (old === "xong") { t.pct = Math.min(t.pct || 0, 90); t.ngayXong = ""; }
      logAction(`Đổi trạng thái “${t.nd.slice(0, 50) || "nhiệm vụ"}”: ${TT[old]} → ${TT[t.tt]}`);
    }
    renderMine(); scheduleSave();
  }
});

// drag & drop evidence
document.addEventListener("dragover", ev => { const d = ev.target.closest?.(".task"); if (d && S.tab === "mine" && d.querySelector(".drop")) { ev.preventDefault(); d.querySelector(".drop").classList.add("over"); } });
document.addEventListener("dragleave", ev => { const d = ev.target.closest?.(".task"); if (d) d.querySelector(".drop")?.classList.remove("over"); });
document.addEventListener("drop", ev => {
  const d = ev.target.closest?.(".task"); if (!d || S.tab !== "mine" || !d.querySelector(".drop")) return;
  ev.preventDefault(); d.querySelector(".drop").classList.remove("over");
  if (ev.dataTransfer?.files?.length) uploadFiles(d.dataset.tid, [...ev.dataTransfer.files]);
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") $(".lightbox")?.remove(); });
window.addEventListener("pagehide", () => { if (S.dirty) flush(); });

const _renderMine = renderMine;
renderMine = function () { _renderMine(); fillReviewNotes(); };

boot();
})();
</script>
