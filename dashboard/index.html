<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theo dõi nhiệm vụ giáo viên</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f2;
    --surface-1: #fcfcfb;
    --surface-2: #f0efec;
    --border: #e2e1dc;
    --grid: #ebeae6;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #6f6e69;
    --accent: #2a78d6;
    --accent-text: #1c5cab;
    --accent-soft: #e6f0fc;
    --series-1: #2a78d6;
    --ref: #a3a29c;
    --r-xs: #104281;
    --r-tot: #256abf;
    --r-ht: #5598e7;
    --r-kht: #86b6ef;
    --on-xs: #fff; --on-tot: #fff; --on-ht: #0b0b0b; --on-kht: #0b0b0b;
    --good: #0ca30c;
    --good-text: #006300;
    --warning: #fab219;
    --warning-text: #7a5300;
    --serious: #ec835a;
    --critical: #d03b3b;
    --critical-text: #b42f2f;
    --shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111110; --surface-1: #1a1a19; --surface-2: #232321; --border: #2e2e2c; --grid: #2a2a28;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #9a9990;
      --accent: #3987e5; --accent-text: #86b6ef; --accent-soft: #1d2a3a;
      --series-1: #3987e5; --ref: #6b6a64;
      --r-xs: #9ec5f4; --r-tot: #5598e7; --r-ht: #2a78d6; --r-kht: #184f95;
      --on-xs: #0b0b0b; --on-tot: #0b0b0b; --on-ht: #fff; --on-kht: #fff;
      --good-text: #4cc94c; --warning-text: #fab219; --critical-text: #e66767; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111110; --surface-1: #1a1a19; --surface-2: #232321; --border: #2e2e2c; --grid: #2a2a28;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #9a9990;
    --accent: #3987e5; --accent-text: #86b6ef; --accent-soft: #1d2a3a;
    --series-1: #3987e5; --ref: #6b6a64;
    --r-xs: #9ec5f4; --r-tot: #5598e7; --r-ht: #2a78d6; --r-kht: #184f95;
      --on-xs: #0b0b0b; --on-tot: #0b0b0b; --on-ht: #fff; --on-kht: #fff;
    --good-text: #4cc94c; --warning-text: #fab219; --critical-text: #e66767; --shadow: none;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text-primary);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 16px 16px 64px; }
  header.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin: 4px 0 12px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  .sub { color: var(--text-secondary); margin: 2px 0 0; font-size: 13px; }
  h2 { font-size: 15px; margin: 0; font-weight: 620; }
  h3 { font-size: 14px; margin: 0; font-weight: 620; }

  nav.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--border); margin-bottom: 16px; scrollbar-width: none; }
  nav.tabs button {
    border: 0; background: none; font: inherit; color: var(--text-secondary); padding: 10px 12px; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  }
  nav.tabs button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--accent); font-weight: 600; }

  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .spacer { flex: 1; }
  select, input[type=text], input[type=number], input[type=month], input[type=search], textarea {
    font: inherit; font-size: 13px; color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; min-width: 0;
  }
  textarea { width: 100%; resize: vertical; line-height: 1.4; }
  input[type=number] { width: 72px; text-align: right; font-variant-numeric: tabular-nums; }
  .btn {
    font: inherit; font-size: 13px; color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { border-color: transparent; background: none; color: var(--text-secondary); }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.danger { color: var(--critical-text); }
  .btn.sm { padding: 3px 8px; font-size: 12px; }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
  .card + .card { margin-top: 12px; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .card-head p { margin: 2px 0 0; color: var(--text-muted); font-size: 12px; }
  .grid { display: grid; gap: 12px; margin-bottom: 12px; }
  .g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .g2 { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
  .g2e { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

  .kpi .label { color: var(--text-secondary); font-size: 13px; }
  .kpi .value { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .kpi .note { font-size: 12px; color: var(--text-muted); }

  .banner { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: var(--accent-soft); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; color: var(--text-secondary); }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chip { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .sw { width: 14px; height: 0; border-top: 2px solid; display: inline-block; }
  .sw.dash { border-top-style: dashed; }

  .chart { position: relative; width: 100%; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .lbl { fill: var(--text-secondary); font-size: 12px; }
  .tip {
    position: absolute; pointer-events: none; z-index: 5; background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.14); min-width: 160px;
    opacity: 0; transition: opacity .08s; white-space: nowrap;
  }
  .tip.on { opacity: 1; }
  .tip .t { color: var(--text-secondary); margin-bottom: 4px; }
  .tip .r { display: flex; justify-content: space-between; gap: 12px; }
  .tip .r b { font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text-muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text-primary); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.c, th.c { text-align: center; }
  tbody tr:last-child td { border-bottom: 0; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--surface-2); }
  tr.grp td { background: var(--surface-2); font-weight: 600; font-size: 12.5px; }
  tr.tot td { font-weight: 650; border-top: 2px solid var(--border); }
  .scroll { overflow-x: auto; }
  .muted { color: var(--text-muted); }
  .small { font-size: 12px; }
  .nowrap { white-space: nowrap; }

  .bar { display: inline-flex; align-items: center; gap: 6px; min-width: 96px; }
  .bar i { display: block; height: 6px; border-radius: 3px; background: var(--grid); width: 48px; position: relative; overflow: hidden; flex: none; }
  .bar i b { position: absolute; inset: 0 auto 0 0; background: var(--series-1); border-radius: 3px; }

  .rank { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .status { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); white-space: nowrap; }
  .status svg { flex: none; }

  .alerts { list-style: none; margin: 0; padding: 0; }
  .alerts li { display: flex; gap: 8px; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .alerts li:last-child { border-bottom: 0; }
  .alerts li svg { flex: none; margin-top: 2px; }
  .alerts a { color: var(--accent-text); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

  /* Evaluation form */
  .sec-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 18px 0 8px; flex-wrap: wrap; }
  .sec-title:first-child { margin-top: 0; }
  .task {
    display: grid; grid-template-columns: 28px minmax(0, 1.4fr) minmax(0, 1.3fr) minmax(0, 1.5fr) 28px; gap: 8px;
    padding: 10px 0; border-bottom: 1px dashed var(--border); align-items: start;
  }
  .task .idx { color: var(--text-muted); padding-top: 6px; font-variant-numeric: tabular-nums; }
  .task .opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .task .opts label { display: grid; gap: 2px; font-size: 11px; color: var(--text-muted); }
  .task .opts label.chk { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); grid-column: 1 / -1; }
  .task select, .task input[type=text] { width: 100%; }
  .task .tre { display: flex; gap: 4px; align-items: center; }
  .task .tre input { width: 56px; }
  .grp-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; padding: 6px 10px;
    background: var(--surface-2); border-radius: 8px; font-weight: 600; font-size: 13px; }
  .empty { color: var(--text-muted); font-size: 12.5px; padding: 8px 0 4px 36px; }
  .sumtbl td, .sumtbl th { text-align: center; padding: 6px 4px; }
  .crit { min-width: 600px; }
  .crit td:first-child { width: 36px; color: var(--text-muted); }
  .crit input[type=number] { width: 64px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: var(--surface-2); color: var(--text-secondary); white-space: nowrap; }
  .pill.ok { color: var(--good-text); }
  .saved { font-size: 12px; color: var(--text-muted); }
  .bigscore { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .stickybar { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 8px 0; margin: -8px 0 8px; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text-primary); color: var(--surface-1);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; max-width: calc(100% - 32px); }
  .toast.on { opacity: 1; }
  .hidden { display: none !important; }
  .help p, .help li { color: var(--text-secondary); }
  .help ol, .help ul { padding-left: 20px; }
  .public-note { font-size: 12px; color: var(--text-muted); margin: 2px 0 0; }
  .ev { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
  .ev-item { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px 4px 4px; background: var(--surface-1); max-width: 100%; min-width: 0; }
  .ev-item img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; display: block; background: var(--surface-2); }
  .ev-item .ficon { width: 44px; height: 44px; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; font-size: 10.5px; font-weight: 700; color: var(--text-secondary); flex: none; }
  .ev-item .meta { display: grid; min-width: 0; }
  .ev-item .meta a { font-size: 12.5px; color: var(--accent-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
  .ev-item .meta small { font-size: 11px; color: var(--text-muted); }
  .ev-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .ev-gallery figure { margin: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-2); }
  .ev-gallery img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; max-width: 100%; }
  .ev-gallery figcaption { font-size: 11.5px; padding: 4px 6px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .loading { padding: 40px 16px; text-align: center; color: var(--text-muted); }

  @media (max-width: 1000px) {
    .g5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .g2, .g2e { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 760px) {
    .task { grid-template-columns: 22px minmax(0, 1fr) 28px; }
    .task > :nth-child(3), .task > :nth-child(4) { grid-column: 2 / 3; }
    .task > :nth-child(5) { grid-column: 3; grid-row: 1; }
  }
  @media (max-width: 760px) { .stickybar { position: static; } }
  @media (max-width: 520px) {
    .g5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi .value { font-size: 22px; }
    .card { padding: 12px; }
  }
  @media print {
    body { background: #fff; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Theo dõi, đánh giá nhiệm vụ CB-GV-NV</h1>
      <p class="sub" id="schoolLine"></p>
      <p class="public-note">Dữ liệu trên trang này đang công khai với người có link.</p>
    </div>
    <div class="row">
      <span class="saved" id="savedMark"></span>
      <button class="btn ghost" data-act="reload" title="Tải lại dữ liệu mới nhất mà người khác vừa cập nhật">↻ Tải lại</button>
      <button class="btn ghost" id="themeBtn" aria-label="Đổi giao diện sáng/tối">◐ Giao diện</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="overview">Tổng quan</button>
    <button role="tab" data-tab="eval">Đánh giá tháng</button>
    <button role="tab" data-tab="person">Theo dõi cá nhân</button>
    <button role="tab" data-tab="staff">Danh sách CB-GV-NV</button>
    <button role="tab" data-tab="data">Dữ liệu &amp; hướng dẫn</button>
  </nav>

  <div id="demoBanner" class="banner hidden"></div>

  <main id="view"><div class="loading">Đang tải dữ liệu chung của trường…</div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/lib/thbana.js"></script>
<script>
(() => {

async function loadAll() {
  const [sc, st, ph] = await Promise.all([TB.list(APP, COL.school), TB.list(APP, COL.staff), TB.list(APP, COL.rec)]);
  remote.school = null; remote.staff.clear(); remote.recs.clear();
  const next = { school: { name: "Trường Tiểu học Bà Nà", donVi: "UBND xã Bà Nà" }, staff: [], records: {}, demo: false };
  if (sc.length) { next.school = { ...next.school, ...sc[0].data }; remote.school = { rid: sc[0].id, json: JSON.stringify(sc[0].data) }; }
  const staffRows = st.slice().sort((a, b) => (a.data.order ?? 0) - (b.data.order ?? 0) || a.created_at.localeCompare(b.created_at));
  for (const r of staffRows) {
    if (!r.data.id || remote.staff.has(r.data.id)) continue;
    next.staff.push(r.data); remote.staff.set(r.data.id, { rid: r.id, json: JSON.stringify(r.data) });
  }
  for (const r of ph) {
    const k = rkey(r.data.staffId, r.data.month);
    if (!r.data.staffId || !r.data.month || remote.recs.has(k)) continue;
    const rec = { ...r.data }; delete rec.staffId; delete rec.month;
    rec.updatedBy = r.updated_by; rec.updatedAt = r.updated_at;
    next.records[k] = rec;
    remote.recs.set(k, { rid: r.id, json: recJson(r.data.staffId, r.data.month, rec) });
  }
  next.demo = next.staff.some(x => x.demo);
  db = next; loaded = true; lastLoad = new Date();
}
function recData(sid, month, rec) { const d = { ...rec, staffId: sid, month }; delete d.updatedBy; delete d.updatedAt; return d; }
function recJson(sid, month, rec) { return JSON.stringify(recData(sid, month, rec)); }
function hasLocalChanges() {
  if (JSON.stringify(db.school) !== remote.school?.json) return true;
  if (db.staff.length !== remote.staff.size || Object.keys(db.records).length !== remote.recs.size) return true;
  for (const x of db.staff) if (remote.staff.get(x.id)?.json !== JSON.stringify(x)) return true;
  for (const [k, rec] of Object.entries(db.records)) { const [sid, m] = k.split("|"); if (remote.recs.get(k)?.json !== recJson(sid, m, rec)) return true; }
  return false;
}
async function pool(tasks, n = 5) {
  let i = 0, firstErr = null;
  const run = async () => { while (i < tasks.length) { const t = tasks[i++]; try { await t(); } catch (e) { firstErr ||= e; } } };
  await Promise.all(Array.from({ length: Math.min(n, tasks.length) }, run));
  if (firstErr) throw firstErr;
}
async function sync() {
  if (!loaded) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; setMark("Đang lưu…");
  try {
    const ops = [];
    const sj = JSON.stringify(db.school);
    if (!remote.school) ops.push(async () => { const r = await TB.create(APP, COL.school, JSON.parse(sj)); remote.school = { rid: r.id, json: sj }; });
    else if (remote.school.json !== sj) ops.push(async () => { await TB.update(APP, COL.school, remote.school.rid, JSON.parse(sj)); remote.school.json = sj; });
    db.staff.forEach((x, i) => { x.order = i; });
    for (const x of db.staff) {
      const j = JSON.stringify(x), r = remote.staff.get(x.id);
      if (!r) ops.push(async () => { const c = await TB.create(APP, COL.staff, JSON.parse(j)); remote.staff.set(x.id, { rid: c.id, json: j }); });
      else if (r.json !== j) ops.push(async () => { await TB.update(APP, COL.staff, r.rid, JSON.parse(j)); r.json = j; });
    }
    for (const [id, r] of remote.staff) if (!db.staff.some(x => x.id === id)) ops.push(async () => { await TB.remove(APP, COL.staff, r.rid); remote.staff.delete(id); });
    for (const [k, rec] of Object.entries(db.records)) {
      const [sid, m] = k.split("|"); const j = recJson(sid, m, rec), r = remote.recs.get(k);
      if (!r) ops.push(async () => { const c = await TB.create(APP, COL.rec, JSON.parse(j)); remote.recs.set(k, { rid: c.id, json: j }); });
      else if (r.json !== j) ops.push(async () => { await TB.update(APP, COL.rec, r.rid, JSON.parse(j)); r.json = j; });
    }
    for (const [k, r] of remote.recs) if (!db.records[k]) ops.push(async () => { await TB.remove(APP, COL.rec, r.rid); remote.recs.delete(k); });
    await pool(ops);
    lastErr = null;
    setMark(ops.length ? "Đã lưu lên máy chủ " + hhmm() : "Đã đồng bộ " + hhmm());
  } catch (e) {
    lastErr = e;
    setMark("⚠ Chưa lưu được");
    toast("Chưa lưu được: " + e.message + infraHint(e.message));
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; sync(); }
  }
}
let saveTimer;
function save(now) {
  clearTimeout(saveTimer);

}
async function reload(quiet) {
  if (syncing || hasLocalChanges()) { if (!quiet) toast("Đang có thay đổi chưa lưu xong, thử lại sau vài giây."); return; }

}

const EV_ACCEPT = "image/jpeg,image/png,image/webp,image/gif,image/heic,.heic,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.txt";
const EXT_MIME = { jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", webp: "image/webp", gif: "image/gif", heic: "image/heic", pdf: "application/pdf", csv: "text/csv", txt: "text/plain",
  doc: "application/msword", docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document", xls: "application/vnd.ms-excel",

async function prepareUpload(f) {
  const ext = (f.name.split(".").pop() || "").toLowerCase();
  let file = f;
  if (!f.type && EXT_MIME[ext]) file = new File([f], f.name, { type: EXT_MIME[ext] });
  if (/^image\/(jpeg|png|webp)$/.test(file.type) && file.size > 1.5 * 1048576) {
    try {
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
      cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
      const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.82));
      if (blob && blob.size < file.size) file = new File([blob], f.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" });
    } catch (e) { /* giữ ảnh gốc */ }
  }
  if (file.size > 10 * 1048576) throw new Error(`“${f.name}” lớn hơn 10 MB. Hãy nén hoặc chia nhỏ.`);
  return file;
}

const bandHT = r => r >= 100 ? 20 : r >= 90 ? 15 : r >= 80 ? 10 : r >= 70 ? 5 : r >= 60 ? 1 : 0;
const bandCL = r => r >= 95 ? 30 : r >= 90 ? 25 : r >= 80 ? 20 : r >= 70 ? 15 : r >= 60 ? 10 : r >= 50 ? 5 : 0;

function newRecord() {
  return { tasks: [], a: { tu: {}, off: {} }, c03: { vp: 0, moi: 0 }, pl: [], kc: [], uu: "", han: "", status: "nhap", updated: null };
}

function taskStats(tasks) {
  const s = { n: tasks.length, done: 0, notdone: 0, som: 0, dung: 0, tre: 0, dam: 0, vuot: 0, chua: 0, dotxuat: 0, ahTre: 0, ahChua: 0, ahCL: 0 };
  for (const t of tasks) {
    if (t.kq === "done") {
      s.done++;
      s[t.td || "dung"]++;
      s[t.cl || "dam"]++;
      if (t.g === 3 && t.cl !== "chua") s.dotxuat++;
      if (t.ah && t.td === "tre") s.ahTre++;
      if (t.ah && t.cl === "chua") s.ahCL++;
    } else {
      s.notdone++;
      if (t.ah) s.ahChua++;
    }
  }
  s.rHT = s.n ? s.done / s.n * 100 : null;
  s.rTD = s.n ? (s.som + s.dung) / s.n * 100 : null;
  s.rCL = s.n ? (s.dam + s.vuot) / s.n * 100 : null;
  s.rSom = s.n ? s.som / s.n * 100 : 0;
  return s;
}

function calc(rec) {
  const s = taskStats(rec.tasks);
  const B = s.n ? { ht: bandHT(s.rHT), td: bandHT(s.rTD), cl: bandCL(s.rCL) } : null;
  const Btot = B ? B.ht + B.td + B.cl : 0;
  let Atu = 0, Aoff = 0, aFilled = 0;
  for (const c of CRIT_ITEMS) {
    const tu = rec.a.tu[c.c], off = rec.a.off[c.c];
    if (tu != null) { Atu += tu; aFilled++; }
    Aoff += off != null ? off : (tu ?? 0);
  }
  const c = {
    dotxuat: Math.min(1, 0.5 * s.dotxuat),
    som: s.rSom >= 80 ? 1 : s.rSom >= 50 ? 0.5 : 0,
    vuot: Math.min(2, s.vuot),
    moi: Math.min(2, Math.max(0, rec.c03.moi || 0)),
    vp: -Math.max(0, rec.c03.vp || 0),
    tre: -s.ahTre, chua: -2 * s.ahChua, cl: -2 * s.ahCL,
  };
  const C03 = Object.values(c).reduce((a, b) => a + b, 0);
  let PLtu = 0, PLoff = 0;
  for (const e of rec.pl) { const v = (e.qty || 0) * (e.p || 0); PLtu += v; if (e.ok !== false) PLoff += v; }
  const totTu = Atu + Btot + C03 + PLtu;
  const totOff = Aoff + Btot + C03 + PLoff;
  const final = rec.status === "duyet" ? totOff : totTu;
  const down = rec.kc.length ? 1 : 0;
  return { s, B, Btot, Atu, Aoff, aFilled, c, C03, PLtu, PLoff, totTu, totOff, final, down, rank: rankOf(final, down), rankTu: rankOf(totTu, down), rankOff: rankOf(totOff, down) };
}
function rankOf(score, down = 0) {
  let i = RANKS.findIndex(r => score >= r.min);
  return RANKS[Math.min(3, i + down)];
}

// Gộp nhiều tháng (quý / năm): cộng dồn công việc, điểm = trung bình cộng điểm các tháng
function aggregate(sid, months) {
  const recs = months.map(m => ({ m, r: db.records[rkey(sid, m)] })).filter(x => x.r && x.r.status !== "nhap");
  if (!recs.length) return null;
  const cs = recs.map(x => ({ m: x.m, rec: x.r, c: calc(x.r) }));
  const all = taskStats(cs.flatMap(x => x.rec.tasks));
  const score = cs.reduce((a, x) => a + x.c.final, 0) / cs.length;
  const down = cs.some(x => x.c.down) ? 1 : 0;
  return { months: cs, s: all, score, down, rank: rankOf(score, down), approved: cs.every(x => x.rec.status === "duyet") };
}

function periodMonths(p) {
  if (p.type === "month") return [p.value];
  if (p.type === "quarter") { const [y, q] = p.value.split("-Q").map(Number); return [1, 2, 3].map(i => ym(y, (q - 1) * 3 + i)); }
  if (p.type === "year") return Array.from({ length: 12 }, (_, i) => ym(+p.value, i + 1));
  const y = +p.value; return [9, 10, 11, 12].map(m => ym(y, m)).concat([1, 2, 3, 4, 5, 6, 7, 8].map(m => ym(y + 1, m)));
}
function periodLabel(p) {
  if (p.type === "month") return monthLabel(p.value);
  if (p.type === "quarter") { const [y, q] = p.value.split("-Q"); return `Quý ${["I", "II", "III", "IV"][q - 1]}/${y}`; }
  if (p.type === "year") return `Năm ${p.value}`;
  return `Năm học ${p.value}-${+p.value + 1}`;
}
function periodOptions(type) {
  const ms = new Set(Object.keys(db.records).map(k => k.split("|")[1])); ms.add(CUR_MONTH);
  const arr = [...ms].sort();
  const opts = new Map();
  for (const m of arr) {
    const [y, mo] = m.split("-").map(Number);
    if (type === "month") opts.set(m, monthLabel(m));
    if (type === "quarter") { const v = `${y}-Q${Math.ceil(mo / 3)}`; opts.set(v, periodLabel({ type, value: v })); }
    if (type === "year") opts.set(String(y), `Năm ${y}`);
    if (type === "schoolyear") { const sy = schoolYearOf(m); opts.set(String(sy), periodLabel({ type, value: String(sy) })); }
  }
  return [...opts.entries()].reverse();
}
function defaultValue(type) {
  const m = latestMonth(); const [y, mo] = m.split("-").map(Number);
  return type === "month" ? m : type === "quarter" ? `${y}-Q${Math.ceil(mo / 3)}` : type === "year" ? String(y) : String(schoolYearOf(m));
}

function tipFor(container) {
  let tip = container.querySelector(".tip");
  if (!tip) { tip = document.createElement("div"); tip.className = "tip"; container.appendChild(tip); }
  return {
    show(html, x, y) {
      tip.innerHTML = html; tip.classList.add("on");
      const cw = container.clientWidth, tw = tip.offsetWidth, th = tip.offsetHeight;
      let left = x + 14; if (left + tw > cw) left = x - tw - 14; if (left < 0) left = Math.max(0, cw - tw);
      let top = y - th - 10; if (top < 0) top = y + 14;

    hide() { tip.classList.remove("on"); },

}

// Biểu đồ đường: điểm theo tháng với các ngưỡng xếp loại
function lineChart(el, pts, opts = {}) {
  const W = Math.max(280, el.clientWidth), H = W < 520 ? 220 : 260;
  const m = { t: 14, r: 92, b: 26, l: 36 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vals = pts.map(p => p.v).filter(v => v != null);
  const lo = Math.max(0, Math.floor(Math.min(40, ...vals) / 10) * 10);
  const hi = Math.max(100, Math.ceil(Math.max(...vals, 0) / 10) * 10);
  const n = pts.length;
  const x = i => m.l + (n === 1 ? iw / 2 : i * iw / (n - 1));
  const y = v => m.t + ih - (v - lo) / (hi - lo) * ih;
  let g = "";
  for (let v = lo; v <= hi; v += 10) {
    g += `<line x1="${m.l}" x2="${m.l + iw}" y1="${y(v)}" y2="${y(v)}" stroke="var(--${v === lo ? "border" : "grid"})"/>`;
    if ((v - lo) % 20 === 0) g += `<text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  for (const [v, lab] of [[90, "Xuất sắc"], [70, "Tốt"], [50, "Hoàn thành"]]) {
    if (v < lo || v > hi) continue;
    g += `<line x1="${m.l}" x2="${m.l + iw}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ref)" stroke-dasharray="3 4"/>`;
    g += `<text x="${m.l + iw + 6}" y="${y(v) + 4}">≥${v} ${lab}</text>`;
  }
  const step = Math.ceil(n / Math.max(2, Math.floor(iw / 52)));
  pts.forEach((p, i) => { if (i % step === 0 || i === n - 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(p.label)}</text>`; });
  let d = "", started = false;
  pts.forEach((p, i) => { if (p.v == null) { started = false; return; } d += `${started ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`; started = true; });
  const dots = pts.map((p, i) => p.v == null ? "" : `<circle cx="${x(i)}" cy="${y(p.v)}" r="${n > 14 ? 0 : 3.5}" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2"/>`).join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || "Biểu đồ điểm theo tháng")}">${g}
    <path d="${d}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}
    <g class="hov" visibility="hidden"><line y1="${m.t}" y2="${m.t + ih}" stroke="var(--text-muted)"/><circle r="5" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2"/></g>
    <rect x="${m.l - 10}" y="0" width="${iw + 20}" height="${H}" fill="transparent" class="hit"/></svg>`;
  const svg = el.querySelector("svg"), hov = el.querySelector(".hov"), tip = tipFor(el);
  const move = ev => {
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) * W / rect.width;
    const i = Math.max(0, Math.min(n - 1, Math.round((px - m.l) / (iw || 1) * (n - 1))));
    const p = pts[i];
    if (p.v == null) { hov.setAttribute("visibility", "hidden"); tip.show(`<div class="t">${esc(p.full || p.label)}</div><div class="muted">Chưa có dữ liệu</div>`, x(i) * rect.width / W, 30); return; }
    hov.setAttribute("visibility", "visible");
    hov.querySelector("line").setAttribute("x1", x(i)); hov.querySelector("line").setAttribute("x2", x(i));
    hov.querySelector("circle").setAttribute("cx", x(i)); hov.querySelector("circle").setAttribute("cy", y(p.v));
    tip.show(`<div class="t">${esc(p.full || p.label)}</div>${(p.rows || [["Điểm", fmt(p.v)]]).map(([k, v]) => `<div class="r"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}`,
      x(i) * rect.width / W, y(p.v) * rect.height / H);
  };
  const hit = el.querySelector(".hit");
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { hov.setAttribute("visibility", "hidden"); tip.hide(); });
}

// Thanh xếp chồng 100%: phân bố xếp loại theo tổ
function stackedRanks(el, rows) {
  const W = Math.max(280, el.clientWidth);
  const labelW = Math.min(110, W * 0.3), cntW = 34, rowH = 34, barH = 16;
  const H = rows.length * rowH;
  const iw = W - labelW - cntW;
  let g = "";
  rows.forEach((row, i) => {
    const yy = i * rowH + (rowH - barH) / 2;
    const total = row.counts.reduce((a, b) => a + b, 0);
    g += `<text class="lbl" x="0" y="${yy + barH / 2 + 4}" ${row.bold ? 'font-weight="650"' : ""}>${esc(row.label)}</text>`;
    g += `<text x="${W}" y="${yy + barH / 2 + 4}" text-anchor="end">${total}</text>`;
    if (!total) { g += `<rect x="${labelW}" y="${yy}" width="${iw}" height="${barH}" rx="4" fill="var(--grid)"/>`; return; }
    let xx = labelW;
    const segs = row.counts.map((c, k) => ({ c, k })).filter(s => s.c);
    segs.forEach((s, j) => {
      const w = s.c / total * iw;
      const gap = j < segs.length - 1 ? 2 : 0;
      const first = j === 0, last = j === segs.length - 1;
      const ww = Math.max(1, w - gap);
      const rl = first ? 4 : 0, rr = last ? 4 : 0;
      g += `<path data-r="${i}" data-k="${s.k}" d="M${xx + rl},${yy} h${ww - rl - rr} ${rr ? `a${rr},${rr} 0 0 1 ${rr},${rr}` : ""} v${barH - 2 * rr} ${rr ? `a${rr},${rr} 0 0 1 -${rr},${rr}` : ""} h-${ww - rl - rr} ${rl ? `a${rl},${rl} 0 0 1 -${rl},-${rl}` : ""} v-${barH - 2 * rl} ${rl ? `a${rl},${rl} 0 0 1 ${rl},-${rl}` : ""} z" fill="${RANKS[s.k].color}"/>`;
      if (w > 22) g += `<text x="${xx + ww / 2}" y="${yy + barH / 2 + 4}" text-anchor="middle" style="fill:var(--on-${RANKS[s.k].k});font-weight:600;pointer-events:none">${s.c}</text>`;
      xx += w;
    });
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Phân bố xếp loại theo tổ">${g}</svg>`;
  const tip = tipFor(el);
  el.querySelectorAll("path[data-r]").forEach(p => {
    const row = rows[+p.dataset.r], k = +p.dataset.k, total = row.counts.reduce((a, b) => a + b, 0);
    const show = ev => { const rc = el.getBoundingClientRect(); tip.show(`<div class="t">${esc(row.label)}</div><div class="r"><span>${esc(RANKS[k].name)}</span><b>${row.counts[k]} người</b></div><div class="r"><span>Tỷ lệ</span><b>${pct(row.counts[k] / total * 100)}</b></div>`, ev.clientX - rc.left, ev.clientY - rc.top); };
    p.addEventListener("pointermove", show); p.addEventListener("pointerdown", show); p.addEventListener("pointerleave", () => tip.hide());
  });
}

    if (lateTasks.length) alerts.push(["serious", `<a data-open="${r.st.id}">${esc(r.st.name)}</a>: ${lateTasks.length} công việc trễ hạn`]);
    if (r.a.down) alerts.push(["critical", `<a data-open="${r.st.id}">${esc(r.st.name)}</a>: có tiêu chí khống chế (hạ 1 bậc xếp loại)`]);

  // Phân bố xếp loại theo tổ
  const rankRows = [{ label: "Toàn trường", bold: true, counts: [0, 0, 0, 0] }].concat(tos.map(t => ({ label: t, counts: [0, 0, 0, 0] })));
  for (const r of withData) { const k = RANKS.indexOf(r.a.rank); rankRows[0].counts[k]++; rankRows[1 + tos.indexOf(r.st.to || "(Chưa có tổ)")].counts[k]++; }

  // Bảng
  let list = rows.filter(r => {
    const f = ui.filter;
    if (f.q && !(r.st.name + " " + r.st.chucVu).toLowerCase().includes(f.q.toLowerCase())) return false;
    if (f.to && (r.st.to || "(Chưa có tổ)") !== f.to) return false;
    if (f.rank && (!r.a || r.a.rank.k !== f.rank)) return false;
    return true;
  });
  const sk = ui.sort.key, dir = ui.sort.dir;
  const val = r => sk === "name" ? r.st.name.split(" ").pop() + r.st.name : sk === "to" ? r.st.to : !r.a ? -Infinity : sk === "score" ? r.a.score : sk === "n" ? r.a.s.n : sk === "rHT" ? r.a.s.rHT : sk === "rTD" ? r.a.s.rTD : sk === "rCL" ? r.a.s.rCL : 0;
  list.sort((a, b) => { const x = val(a), y = val(b); return (typeof x === "string" ? x.localeCompare(y, "vi") : x - y) * dir; });
  const th = (k, l, cls = "") => `<th class="sortable ${cls}" data-sort="${k}" aria-sort="${sk === k ? (dir > 0 ? "ascending" : "descending") : "none"}">${l}${sk === k ? (dir > 0 ? " ▲" : " ▼") : ""}</th>`;
  const bar = v => v == null ? "–" : `<span class="bar"><i><b style="width:${Math.max(0, Math.min(100, v))}%"></b></i>${pct(v)}</span>`;

  $("#view").innerHTML = `
  <div class="row" style="margin-bottom:12px">
    ${typeSel}
    <span class="spacer"></span>
    <button class="btn" data-act="copyAI" title="Sao chép số liệu kèm câu lệnh để dán vào Trợ lý AI (Gemini, ChatGPT, NotebookLM…)">✨ Sao chép cho Trợ lý AI</button>
    <button class="btn" data-act="exportSummary">⬇ Xuất Excel tổng hợp</button>
  </div>
  <section class="grid g5" aria-label="Chỉ số chính">
    <div class="card kpi"><div class="label">${isMonth ? "Đã nộp tự đánh giá" : "Có kết quả đánh giá"}</div><div class="value">${nSubmitted}/${db.staff.length}</div><div class="note">${isMonth ? `${nApproved} phiếu đã duyệt` : esc(periodLabel(ui.period))}</div></div>
    <div class="card kpi"><div class="label">Điểm trung bình</div><div class="value">${fmt(avg, 1)}</div><div class="note">${avg != null ? esc(rankOf(avg).name) : "Chưa có dữ liệu"}</div></div>
    <div class="card kpi"><div class="label">Tỷ lệ hoàn thành công việc</div><div class="value">${pct(tasks.n ? tasks.done / tasks.n * 100 : null)}</div><div class="note">${tasks.done}/${tasks.n} việc · ${tasks.notdone} chưa HT</div></div>
    <div class="card kpi"><div class="label">Đúng và sớm hạn</div><div class="value">${pct(tasks.n ? (tasks.som + tasks.dung) / tasks.n * 100 : null)}</div><div class="note">${tasks.tre} việc trễ hạn</div></div>
    <div class="card kpi"><div class="label">Đảm bảo chất lượng trở lên</div><div class="value">${pct(tasks.n ? (tasks.dam + tasks.vuot) / tasks.n * 100 : null)}</div><div class="note">${tasks.vuot} việc vượt mức</div></div>
  </section>
  <section class="grid g2">
    <div class="card">
      <div class="card-head"><div><h2>Điểm trung bình toàn trường theo tháng</h2><p>12 tháng gần nhất · đường đứt là ngưỡng xếp loại</p></div></div>
      <div class="chart" id="trendChart"></div>
    </div>
    <div class="card">
      <div class="card-head"><div><h2>Phân bố xếp loại theo tổ</h2><p>${esc(periodLabel(ui.period))} · số người</p></div></div>
      <div class="legend">${RANKS.map(r => `<span><i class="chip" style="background:${r.color}"></i>${esc(r.short)}</span>`).join("")}</div>
      <div class="chart" id="rankChart"></div>
    </div>
  </section>
  <section style="margin-bottom:12px">
    <div class="card">
      <div class="card-head"><div><h2>Cần chú ý</h2><p>${esc(periodLabel(ui.period))}</p></div></div>
      ${alerts.length ? `<ul class="alerts">${alerts.slice(0, 40).map(([k, h]) => `<li>${ICON[k]}<span>${h}</span></li>`).join("")}</ul>` : `<p class="muted">${statusHtml("good", "Không có vấn đề cần chú ý.")}</p>`}
    </div>
  </section>
  <section>
    <div class="card">
      <div class="card-head">
        <div><h2>Kết quả từng người</h2><p>${esc(periodLabel(ui.period))}${isMonth ? "" : " · điểm = trung bình cộng điểm các tháng"} · bấm vào một dòng để xem chi tiết</p></div>
        <div class="row">
          <input type="search" id="fQ" placeholder="Tìm tên…" value="${esc(ui.filter.q)}" aria-label="Tìm theo tên">
          <select id="fTo" aria-label="Lọc theo tổ"><option value="">Tất cả tổ</option>${tos.map(t => `<option ${ui.filter.to === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
          <select id="fRank" aria-label="Lọc theo xếp loại"><option value="">Mọi xếp loại</option>${RANKS.map(r => `<option value="${r.k}" ${ui.filter.rank === r.k ? "selected" : ""}>${esc(r.short)}</option>`).join("")}</select>
        </div>
      </div>

          <td style="min-width:170px"><b>${esc(r.st.name)}</b><div class="small muted">${esc(r.st.chucVu)}${r.st.lop ? " · Lớp " + esc(r.st.lop) : ""}</div></td>
          <td class="nowrap">${esc(r.st.to)}</td>
          <td class="num">${r.a ? `${r.a.s.done}/${r.a.s.n}` : "–"}</td>
          <td>${bar(r.a?.s.rHT)}</td><td>${bar(r.a?.s.rTD)}</td><td>${bar(r.a?.s.rCL)}</td>
          <td class="num"><b>${r.a ? fmt(r.a.score) : "–"}</b></td>
          <td>${rankHtml(r.a?.rank)}</td>
          <td>${isMonth ? recStatusHtml(r.recStatus) : r.a ? `<span class="small muted">${r.a.nMonths} tháng</span>` : recStatusHtml(null)}</td>
        </tr>`).join("") || `<tr><td colspan="9" class="muted">Không có ai khớp bộ lọc.</td></tr>`}</tbody>
      </table></div>
    </div>
  </section>`;

  // Biểu đồ xu hướng
  const endM = months[months.length - 1] > CUR_MONTH ? CUR_MONTH : months[months.length - 1];
  let trendMonths = Array.from({ length: 12 }, (_, i) => addMonth(endM, i - 11));
  const hasData = m => db.staff.some(s => { const r = db.records[rkey(s.id, m)]; return r && r.status !== "nhap"; });
  while (trendMonths.length > 1 && !hasData(trendMonths[0])) trendMonths.shift();
  const pts = trendMonths.map(m => {
    const sc = db.staff.map(s => db.records[rkey(s.id, m)]).filter(r => r && r.status !== "nhap").map(r => calc(r).final);
    const v = sc.length ? sc.reduce((a, b) => a + b, 0) / sc.length : null;
    return { label: monthShort(m), full: monthLabel(m), v, rows: v == null ? null : [["Điểm trung bình", fmt(v, 1)], ["Số phiếu", String(sc.length)], ["Xếp loại TB", rankOf(v).short]] };
  });
  if (pts.some(p => p.v != null)) lineChart($("#trendChart"), pts, { aria: "Điểm trung bình toàn trường theo tháng" });
  else $("#trendChart").innerHTML = `<p class="muted">Chưa có dữ liệu.</p>`;
  stackedRanks($("#rankChart"), rankRows);
}

function onOverviewClick(ev) {
  const s = ev.target.closest("[data-sort]");
  if (s) { const k = s.dataset.sort; ui.sort = { key: k, dir: ui.sort.key === k ? -ui.sort.dir : (k === "name" || k === "to" ? 1 : -1) }; renderOverview(); return true; }
  const o = ev.target.closest("[data-open]");
  if (o) {
    const sid = o.dataset.open;
    if (ui.period.type === "month") { ui.evalStaff = sid; ui.evalMonth = ui.period.value; setTab("eval"); }
    else { ui.person = sid; ui.personYear = schoolYearOf(periodMonths(ui.period).slice(-1)[0]); setTab("person"); }
    return true;
  }
  return false;
}

function getRec(create) {
  const k = rkey(ui.evalStaff, ui.evalMonth);
  if (!db.records[k] && create) db.records[k] = newRecord();
  return db.records[k];
}
const staffById = id => db.staff.find(s => s.id === id);
function catFor(st) {
  const t = STAFF_TYPES[st.type] || STAFF_TYPES.gvcn;
  return CATALOG[t.pl].map((x, i) => ({ ...x, i })).filter(x => !(st.type === "gvbm" && x.s === "III"));
}
function staffSelect(id, value) {
  const groups = {};
  db.staff.forEach(s => (groups[s.to || "(Chưa có tổ)"] ||= []).push(s));
  return `<select id="${id}" aria-label="Chọn người">${Object.entries(groups).map(([g, arr]) => `<optgroup label="${esc(g)}">${arr.map(s => `<option value="${s.id}" ${s.id === value ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</optgroup>`).join("")}</select>`;
}

function suggestComments(rec, st) {
  const c = calc(rec), s = c.s, uu = [], han = [];
  if (s.n) {
    if (s.rHT >= 100) uu.push(`Hoàn thành 100% (${s.done}/${s.n}) công việc, sản phẩm được giao.`);
    else uu.push(`Hoàn thành ${s.done}/${s.n} công việc được giao (${pct(s.rHT)}).`);
    if (s.rTD >= 90) uu.push(`Đảm bảo tiến độ ${pct(s.rTD)} công việc${s.som ? `, trong đó ${s.som} việc hoàn thành sớm hạn` : ""}.`);
    if (s.rCL >= 90) uu.push(`Chất lượng công việc đảm bảo yêu cầu (${pct(s.rCL)})${s.vuot ? `, có ${s.vuot} sản phẩm vượt mức được ghi nhận` : ""}.`);
  }
  const chuTri = rec.tasks.filter(t => t.md === "chu" && t.kq === "done" && t.tc !== "bt");
  if (chuTri.length) uu.push(`Chủ trì hoàn thành ${chuTri.length} nhiệm vụ phức tạp: ${chuTri.slice(0, 2).map(t => t.nd.replace(/\.$/, "")).join("; ")}.`);
  const plus = rec.pl.filter(e => (e.p || 0) > 0 && e.ok !== false);
  if (plus.length) uu.push(`Tích cực tham gia phong trào: ${plus.map(e => e.t.split(/[.(]/)[0].trim()).slice(0, 3).join("; ")}.`);
  if (c.Aoff >= 29) uu.push("Chấp hành tốt chủ trương, chính sách, nội quy; có tinh thần trách nhiệm, đoàn kết, phối hợp tốt với đồng nghiệp.");

  const notDone = rec.tasks.filter(t => t.kq !== "done"), late = rec.tasks.filter(t => t.kq === "done" && t.td === "tre"), weak = rec.tasks.filter(t => t.kq === "done" && t.cl === "chua");
  if (notDone.length) han.push(`Còn ${notDone.length} công việc chưa hoàn thành: ${notDone.map(t => t.nd.replace(/\.$/, "")).slice(0, 2).join("; ")}.`);
  if (late.length) han.push(`${late.length} công việc hoàn thành trễ hạn${late.some(t => t.tre) ? ` (trễ ${late.map(t => t.tre || 0).reduce((a, b) => a + b, 0)} ngày)` : ""}.`);
  if (weak.length) han.push(`${weak.length} sản phẩm chưa đảm bảo chất lượng, phải chỉnh sửa, bổ sung.`);
  const minus = rec.pl.filter(e => (e.p || 0) < 0 && e.ok !== false);
  if (minus.length) han.push(`Bị trừ điểm: ${minus.map(e => e.t.split(/[.(]/)[0].trim() + (e.qty > 1 ? ` (${e.qty} lần)` : "")).slice(0, 3).join("; ")}.`);
  const lowA = CRIT_ITEMS.filter(x => { const v = rec.a.off[x.c] ?? rec.a.tu[x.c]; return v != null && v < x.max; });
  if (lowA.length) han.push(`Cần cố gắng thêm ở tiêu chí: ${lowA.slice(0, 2).map(x => x.t.split(/[;,]/)[0].toLowerCase()).join("; ")}.`);
  if (!han.length) han.push("Không có hạn chế đáng kể trong kỳ.");
  return { uu: uu.join("\n"), han: han.join("\n") };
}

function onEvalInput(ev) {
  const el = ev.target, rec = getRec(false); if (!rec) return false;
  const tRow = el.closest("[data-tid]");
  if (tRow && el.dataset.f) {
    const t = rec.tasks.find(x => x.id === tRow.dataset.tid); const f = el.dataset.f;
    t[f] = el.type === "checkbox" ? el.checked : el.type === "number" ? (num(el.value) ?? 0) : el.value;
    if (f === "kq" && t.kq === "done") { t.td ||= "dung"; t.cl ||= "dam"; }
    if (f === "kq" || f === "td") { if (ev.type === "change") { renderEval(); save(); } return true; }
    updateEvalTotals(); save(); return true;
  }
  if (el.dataset.a) {
    const v = num(el.value); const c = CRIT_ITEMS.find(x => x.c === el.dataset.c);
    if (v == null) delete rec.a[el.dataset.a][c.c]; else rec.a[el.dataset.a][c.c] = Math.max(0, Math.min(c.max, v));
    if (el.dataset.a === "tu") { const off = $(`[data-a="off"][data-c="${c.c}"]`); if (off) off.placeholder = el.value; }
    updateEvalTotals(); save(); return true;
  }
  if (el.dataset.c03) { rec.c03[el.dataset.c03] = Math.max(0, Math.floor(num(el.value) || 0)); if (ev.type === "change") updateEvalTotals(); save(); return true; }
  const pRow = el.closest("[data-pid]");
  if (pRow && el.dataset.p) {
    const e = rec.pl.find(x => x.id === pRow.dataset.pid); const f = el.dataset.p;
    e[f] = f === "ok" ? el.checked : (f === "qty" || f === "p") ? num(el.value) : el.value;
    updateEvalTotals(); save(); return true;
  }
  if (el.dataset.kc != null && el.type === "checkbox") {
    const i = +el.dataset.kc; rec.kc = rec.kc.filter(x => x !== i); if (el.checked) rec.kc.push(i);
    updateEvalTotals(); save(); return true;
  }
  if (el.dataset.r) { rec[el.dataset.r] = el.value; save(); return true; }
  return false;
}

}

let xlsxP;
function loadXLSX() {
  return xlsxP ||= new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = () => res(window.XLSX);
    s.onerror = () => { xlsxP = null; rej(new Error("Không tải được thư viện Excel (cần kết nối Internet).")); };
    document.head.appendChild(s);
  });
}
function csvDownload(name, rows) {
  const csv = "﻿" + rows.map(r => r.map(v => { const s = String(v ?? ""); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(",")).join("\r\n");
  download(name, csv, "text/csv;charset=utf-8");
}
async function writeSheet(name, aoa, merges, cols) {
  try {
    const X = await loadXLSX();
    const ws = X.utils.aoa_to_sheet(aoa);
    if (merges) ws["!merges"] = merges;
    if (cols) ws["!cols"] = cols.map(w => ({ wch: w }));
    const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, "Sheet1");
    X.writeFile(wb, name + ".xlsx");
  } catch (e) { toast(e.message + " Đã xuất dạng CSV thay thế."); csvDownload(name + ".csv", aoa); }
}

function pickFile(accept) {
  return new Promise(res => { const i = document.createElement("input"); i.type = "file"; i.accept = accept; i.onchange = () => res(i.files[0]); i.click(); });
}
async function importStaff() {
  const f = await pickFile(".xlsx,.xls,.csv"); if (!f) return;
  try {
    const X = await loadXLSX();
    const wb = X.read(await f.arrayBuffer());
    const rows = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
    const hi = rows.findIndex(r => r.some(c => /họ.*tên/i.test(String(c))));
    if (hi < 0) { toast("Không tìm thấy cột “Họ và tên” trong file."); return; }
    const h = rows[hi].map(c => String(c).toLowerCase());
    const col = re => h.findIndex(c => re.test(c));
    const cN = col(/họ.*tên/), cC = col(/chức/), cT = col(/^tổ|tổ /), cL = col(/lớp/), cK = col(/loại|đối tượng/);
    let n = 0;
    for (const r of rows.slice(hi + 1)) {
      const name = String(r[cN] || "").trim(); if (!name) continue;
      const k = String(r[cK] ?? "").toLowerCase();
      const cv = cC >= 0 ? String(r[cC]).trim() : "";
      const type = /bm|bộ môn/.test(k) ? "gvbm" : /cbnv|nv|bgh|văn phòng/.test(k) || /hiệu|kế toán|thư viện|tổng phụ trách|nhân viên|văn thư|y tế|bảo vệ/i.test(cv) ? "cbnv" : "gvcn";
      db.staff.push({ id: uid(), name, chucVu: cv || "Giáo viên", to: cT >= 0 ? String(r[cT]).trim() : "", lop: cL >= 0 ? String(r[cL]).trim() : "", type });
      n++;
    }
    save(true); renderStaff(); toast(`Đã thêm ${n} người.`);
  } catch (e) { toast("Không đọc được file: " + e.message); }
}

    ? `- ${r.st.name} (${r.st.chucVu}, ${r.st.to}): giao ${r.a.s.n}, hoàn thành ${r.a.s.done} (${pct(r.a.s.rHT)}), đúng/sớm hạn ${pct(r.a.s.rTD)}, đảm bảo CL ${pct(r.a.s.rCL)}, trễ hạn ${r.a.s.tre}, điểm ${fmt(r.a.score)}, xếp loại: ${r.a.rank.name}`
    : `- ${r.st.name} (${r.st.chucVu}, ${r.st.to}): chưa có kết quả đánh giá`);
  return `Bạn là trợ lý giúp Ban Giám hiệu ${db.school.name} tổng hợp kết quả theo dõi, đánh giá thực hiện nhiệm vụ của CB-GV-NV theo Nghị định 335/2025/NĐ-CP (Mẫu 01TKNV, Mẫu 03).

Kỳ đánh giá: ${periodLabel(ui.period)}.
Thang xếp loại: ≥90 điểm Hoàn thành xuất sắc; ≥70 Hoàn thành tốt; 50–<70 Hoàn thành; <50 Không hoàn thành nhiệm vụ.

Số liệu từng người:
${lines.join("\n")}

Yêu cầu:
1. Viết đoạn nhận xét chung về tiến độ, chất lượng thực hiện nhiệm vụ của tập thể trong kỳ (khoảng 150–200 chữ, văn phong hành chính).
2. Nêu những cá nhân tiêu biểu và những trường hợp cần nhắc nhở, kèm lý do dựa trên số liệu.
3. Đề xuất 3–5 giải pháp cụ thể cho kỳ tới.
Chỉ dựa trên số liệu trên, không suy đoán thêm.`;
}

// =====================================================================
// 14. ĐIỀU HƯỚNG & SỰ KIỆN
// =====================================================================
function setTab(t) {
  ui.tab = t;
  try { sessionStorage.setItem("tdgv-tab", t); } catch (e) {}
  $$("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  render();
  window.scrollTo({ top: 0 });
}
function render() {
  if (!loaded) return;
  $("#schoolLine").textContent = `${db.school.name} · ${db.school.donVi}`;
  const bn = $("#demoBanner");
  if (db.demo) bn.innerHTML = `<span>Đang có <b>dữ liệu mẫu</b> (tên giả: Giáo viên A, B…) để xem thử. Trước khi nhập dữ liệu thật, hãy xoá dữ liệu mẫu.</span><span class="spacer"></span><button class="btn sm" data-act="clearDemo">Xoá dữ liệu mẫu</button>`;
  else if (!db.staff.length) bn.innerHTML = `<span>Chưa có dữ liệu. Nạp dữ liệu mẫu để xem thử, hoặc vào <b>Danh sách CB-GV-NV</b> để nhập danh sách thật.</span><span class="spacer"></span><button class="btn sm primary" data-act="loadDemo">Nạp dữ liệu mẫu</button>`;
  bn.classList.toggle("hidden", !(db.demo || !db.staff.length));
  ({ overview: renderOverview, eval: renderEval, person: renderPerson, staff: renderStaff, data: renderData })[ui.tab]();
}

$("nav.tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) setTab(b.dataset.tab); });

document.addEventListener("input", e => {
  if (ui.tab === "eval") { onEvalInput(e); return; }
  const el = e.target;
  if (ui.tab === "overview" && el.id === "fQ") { ui.filter.q = el.value; const pos = el.selectionStart; renderOverview(); const n = $("#fQ"); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (ui.tab === "staff" && el.dataset.s && el.tagName === "INPUT") { const s = staffById(el.closest("[data-sid]").dataset.sid); s[el.dataset.s] = el.value; save(); return; }
  if (ui.tab === "data" && el.dataset.school) { db.school[el.dataset.school] = el.value; $("#schoolLine").textContent = `${db.school.name} · ${db.school.donVi}`; save(); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (ui.tab === "overview") {
    if (el.id === "pType") { ui.period = { type: el.value, value: defaultValue(el.value) }; renderOverview(); }
    else if (el.id === "pValue") { ui.period.value = el.value; renderOverview(); }
    else if (el.id === "fTo") { ui.filter.to = el.value; renderOverview(); }
    else if (el.id === "fRank") { ui.filter.rank = el.value; renderOverview(); }
    return;
  }
  if (ui.tab === "eval") {
    if (el.id === "eStaff") { ui.evalStaff = el.value; renderEval(); return; }
    if (el.id === "eMonth") { if (el.value) { ui.evalMonth = el.value; renderEval(); } return; }
    if (el.matches("select[data-f], input[type=checkbox], input[type=number][data-c03]")) onEvalInput(e);
    return;
  }
  if (ui.tab === "person") {
    if (el.id === "pStaff") { ui.person = el.value; renderPerson(); }
    if (el.id === "pYear") { ui.personYear = +el.value; renderPerson(); }
    return;
  }
  if (ui.tab === "staff" && el.dataset.s && el.tagName === "SELECT") { staffById(el.closest("[data-sid]").dataset.sid).type = el.value; save(); }
});

document.addEventListener("click", async e => {
  if (ui.tab === "overview" && !e.target.closest("button, select, input") && onOverviewClick(e)) return;
  if (ui.tab === "person") { const tr = e.target.closest("[data-month]"); if (tr) { ui.evalStaff = ui.person; ui.evalMonth = tr.dataset.month; setTab("eval"); return; } }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  const rec = ui.tab === "eval" ? getRec(false) : null;
  switch (act) {
    case "newRec": getRec(true); save(); renderEval(); break;
    case "newRecCopy": { const r = getRec(true); r.tasks = copyTasksFrom(db.records[rkey(ui.evalStaff, addMonth(ui.evalMonth, -1))]); save(); renderEval(); toast(`Đã sao chép ${r.tasks.length} công việc. Hãy cập nhật kết quả từng việc.`); break; }
    case "copyPrev": {
      const p = db.records[rkey(ui.evalStaff, addMonth(ui.evalMonth, -1))];
      if (!p || !p.tasks.length) { toast("Tháng trước chưa có công việc để sao chép."); break; }
      if (rec.tasks.length && !confirm(`Thêm ${p.tasks.length} công việc từ tháng trước vào danh sách hiện có?`)) break;
      rec.tasks.push(...copyTasksFrom(p)); save(); renderEval(); break;
    }
    case "addTask": rec.tasks.push({ id: uid(), g: +b.dataset.g, nd: "", tc: "bt", md: "chu", kq: "done", han: monthLabel(ui.evalMonth), td: "dung", tre: 0, cl: "dam", ah: false, kqnd: "" }); save(); renderEval();
      setTimeout(() => { const last = rec.tasks[rec.tasks.length - 1]; const ta = $(`[data-tid="${last.id}"] textarea`); ta && ta.focus(); }, 0); break;
    case "delTask": { const id = b.closest("[data-tid]").dataset.tid; const t = rec.tasks.find(x => x.id === id); if (t.nd && !confirm("Xoá công việc này?")) break; rec.tasks = rec.tasks.filter(x => x.id !== id); save(); renderEval(); break; }
    case "fillMax": CRIT_ITEMS.forEach(c => { if (rec.a.tu[c.c] == null) rec.a.tu[c.c] = c.max; }); save(); renderEval(); break;
    case "copyOff": rec.a.off = {}; save(); renderEval(); toast("Cột chính thức đã đặt bằng điểm tự chấm."); break;
    case "addPl": {
      const st = staffById(ui.evalStaff), i = +$("#plPick").value, x = CATALOG[STAFF_TYPES[st.type].pl][i];
      rec.pl.push({ id: uid(), ref: i, t: x.t, p: x.p, qty: 1, note: "", ok: true }); save(); renderEval();
      if (x.m) toast("Mục này có nhiều mức điểm – hãy kiểm tra lại ô “Điểm/lần”.");
      break;
    }
    case "addPlCustom": rec.pl.push({ id: uid(), ref: null, t: "", p: 0, qty: 1, note: "", ok: true }); save(); renderEval(); break;
    case "delPl": { const id = b.closest("[data-pid]").dataset.pid; rec.pl = rec.pl.filter(x => x.id !== id); save(); renderEval(); break; }
    case "suggest": {
      const sg = suggestComments(rec, staffById(ui.evalStaff));
      if ((rec.uu || rec.han) && !confirm("Thay nội dung ưu điểm/hạn chế hiện có bằng gợi ý tự động?")) break;
      rec.uu = sg.uu; rec.han = sg.han; save(); $('[data-r="uu"]').value = rec.uu; $('[data-r="han"]').value = rec.han; toast("Đã tạo gợi ý. Hãy đọc lại và chỉnh sửa trước khi dùng."); break;
    }
    case "setStatus": {
      const s = b.dataset.s;
      if (s !== "nhap") { const c = calc(rec); if (!rec.tasks.length) { toast("Chưa có công việc nào trong phiếu."); break; } if (c.aFilled < CRIT_ITEMS.length && !confirm(`Phần A còn ${CRIT_ITEMS.length - c.aFilled} tiêu chí chưa chấm. Vẫn chuyển trạng thái?`)) break; }
      rec.status = s; rec.updated = new Date().toISOString(); save(); renderEval(); break;
    }
    case "delRec": if (confirm(`Xoá phiếu ${monthLabel(ui.evalMonth)} của ${staffById(ui.evalStaff).name}?`)) {
      for (const e of [...(rec.evGen || []), ...rec.tasks.flatMap(t => t.ev || [])]) TB.removeFile(e.key).catch(() => {});
      delete db.records[rkey(ui.evalStaff, ui.evalMonth)]; save(); renderEval(); } break;
    case "print": printRecord(); break;
    case "exportMau01": exportMau01(); break;
    case "exportSummary": exportSummary(); break;
    case "copyAI": {
      const text = aiPrompt();
      try { await navigator.clipboard.writeText(text); toast("Đã sao chép. Mở Gemini/ChatGPT/NotebookLM và dán (Ctrl+V)."); }
      catch (err) { download("tro_ly_AI.txt", text, "text/plain;charset=utf-8"); toast("Không sao chép được, đã tải về file văn bản."); }
      break;
    }
    case "addStaff": db.staff.push({ id: uid(), name: "", chucVu: "Giáo viên", to: "", lop: "", type: "gvcn" }); save(); renderStaff(); setTimeout(() => { const ins = $$('input[data-s="name"]'); ins[ins.length - 1].focus(); }, 0); break;
    case "delStaff": {
      const sid = b.closest("[data-sid]").dataset.sid, s = staffById(sid);
      const n = Object.keys(db.records).filter(k => k.startsWith(sid + "|")).length;
      if (!confirm(`Xoá ${s.name || "người này"}${n ? ` và ${n} phiếu đánh giá` : ""}?`)) break;
      db.staff = db.staff.filter(x => x.id !== sid); for (const k of Object.keys(db.records)) if (k.startsWith(sid + "|")) delete db.records[k];
      save(); renderStaff(); break;
    }
    case "importStaff": importStaff(); break;
    case "backup": download(`sao_luu_danh_gia_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(db, null, 1), "application/json"); break;
    case "clearDemo": {
      if (!confirm("Xoá dữ liệu mẫu (những người tên giả và phiếu của họ)? Dữ liệu thật không bị ảnh hưởng.")) break;
      const ids = new Set(db.staff.filter(x => x.demo).map(x => x.id));
      db.staff = db.staff.filter(x => !ids.has(x.id));
      for (const k of Object.keys(db.records)) if (ids.has(k.split("|")[0])) delete db.records[k];
      db.demo = false; initUi(); toast("Đang xoá dữ liệu mẫu trên máy chủ…"); await sync(); render(); break;
    }
    case "loadDemo": {
      if (db.demo && !confirm("Đã có dữ liệu mẫu. Nạp thêm một bộ nữa?")) break;
      const d = demo();
      db.staff.push(...d.staff); Object.assign(db.records, d.records); db.demo = true;
      initUi(); render(); toast(`Đang lưu ${d.staff.length} người và ${Object.keys(d.records).length} phiếu mẫu lên máy chủ…`); await sync(); render(); break;
    }
    case "reload": reload(); break;
    case "upEv": {
      const files = await pickFiles(EV_ACCEPT); if (!files.length) break;
      await uploadEvidence(evList(rec, b.dataset.scope), files); renderEval(); break;
    }
    case "delEv": {
      const it = b.closest("[data-ei]"); const list = evList(rec, it.dataset.scope); const e = list[+it.dataset.ei];
      if (!e || !confirm(`Xoá minh chứng “${e.name}”?`)) break;
      try { await TB.removeFile(e.key); }
      catch (err) { if (!/Không tìm thấy/.test(err.message)) { toast(err.message); break; } }
      list.splice(+it.dataset.ei, 1); save(true); renderEval(); toast("Đã xoá minh chứng."); break;
    }
  }
});

const root = document.documentElement;
try { const t = localStorage.getItem("tdgv-theme"); if (t) root.dataset.theme = t; } catch (e) {}
$("#themeBtn").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("tdgv-theme", root.dataset.theme); } catch (e) {}
});
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (ui.tab === "overview") renderOverview(); if (ui.tab === "person") renderPerson(); }, 150); });

$$("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === ui.tab));
(async () => {
  try {
    if (!window.TB) throw new Error("Không nạp được thư viện dùng chung /lib/thbana.js.");
    await loadAll();
    initUi();
    setMark("Đã tải lúc " + hhmm());
    setTab(ui.tab);
  } catch (e) {
    $("#view").innerHTML = `<div class="card"><h2>Chưa tải được dữ liệu</h2><p style="margin-top:6px">${esc(e.message)}${esc(infraHint(e.message))}</p><p class="small muted">Hãy tải lại trang. Nếu vẫn lỗi, báo quản trị viên kèm thông báo trên.</p><button class="btn" onclick="location.reload()">Tải lại trang</button></div>`;
  }
})();
addEventListener("focus", () => { if (loaded) reload(true); });
addEventListener("beforeunload", e => { if (loaded && (syncing || hasLocalChanges())) { sync(); e.preventDefault(); e.returnValue = ""; } });
})();
</script>
